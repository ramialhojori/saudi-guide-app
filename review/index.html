<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>مراجعة اسأل أهل المدينة</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d2321;--mute:#6b736f;--line:#e4e2db;--brand:#0f6b4f;--brand2:#e8f3ee;--red:#b42318;--red2:#fdecea;--amb:#9a6700;--amb2:#fff5d6}
@media (prefers-color-scheme:dark){:root{--bg:#121514;--card:#1b1f1d;--ink:#eef1ef;--mute:#9aa39f;--line:#2b302d;--brand:#3fbf8f;--brand2:#173027;--red:#ff8a80;--red2:#3a1f1d;--amb:#f0c050;--amb2:#352b12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Segoe UI",Tahoma,"IBM Plex Sans Arabic",sans-serif;padding:16px;padding-bottom:40px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--mute);font-size:13px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin:6px 0}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--brand2);color:var(--brand);font-weight:600}
button.pri{background:var(--brand);color:#fff;width:100%;padding:12px}
button.ok{background:var(--brand);color:#fff}
button.no{background:var(--red2);color:var(--red)}
button.ghost{background:transparent;color:var(--mute);padding:6px 8px}
button:disabled{opacity:.5}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 12px;padding-bottom:2px}
.tabs button{white-space:nowrap;background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:500}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.n{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--amb2);color:var(--amb);font-size:12px;margin-inline-start:4px}
.meta{color:var(--mute);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 10px;margin-bottom:6px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:0 8px}
.q{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--mute);margin-bottom:8px}
.body{white-space:pre-wrap;word-break:break-word;margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.msg{font-size:13px;margin-top:8px;min-height:18px}
.err{color:var(--red)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.link{background:none;color:var(--brand);padding:0;font-weight:500}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="top">
  <div><h1>مراجعة «اسأل أهل المدينة»</h1><p class="sub">وافق على الأسئلة والإجابات قبل ما تظهر للناس</p></div>
  <button class="ghost" id="out" hidden>خروج</button>
</div>

<section id="login" class="card" hidden>
  <b id="lt">تسجيل دخول المدير</b>
  <input id="em" type="email" placeholder="الإيميل" autocomplete="username" dir="ltr">
  <input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password" dir="ltr">
  <button class="pri" id="go">دخول</button>
  <div class="msg" id="lm"></div>
  <p class="sub" style="margin:10px 0 0">أول مرة؟ <button class="link" id="sw">أنشئ حساب المدير</button></p>
</section>

<section id="app" hidden>
  <div class="tabs" id="tabs">
    <button data-t="q" class="on">أسئلة جديدة<span class="n" id="nq">0</span></button>
    <button data-t="a">إجابات جديدة<span class="n" id="na">0</span></button>
    <button data-t="r">بلاغات<span class="n" id="nr">0</span></button>
    <button data-t="live">المنشور</button>
  </div>
  <div id="list"></div>
</section>

<script>
var SUPABASE_URL='https://qnjixxctlwinglmhgijc.supabase.co';
var KEY='sb_publishable_Ta_HT5_r1UPYj8y7MKozdg_VKLL_bwa';
var CAT={food:'أكل وقهوة',places:'أماكن ومشاوير',stay:'سكن',transport:'مواصلات',events:'فعاليات',family:'عائلات',prices:'أسعار وتوفير',general:'عام'};
var S=null,tab='q',signup=false;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ago(d){var m=Math.round((Date.now()-new Date(d))/60000);if(m<1)return'الحين';if(m<60)return'قبل '+m+' دقيقة';var h=Math.round(m/60);if(h<24)return'قبل '+h+' ساعة';return'قبل '+Math.round(h/24)+' يوم'}
function save(){try{S?localStorage.setItem('sg_admin',JSON.stringify(S)):localStorage.removeItem('sg_admin')}catch(e){}}
function load(){try{S=JSON.parse(localStorage.getItem('sg_admin')||'null')}catch(e){S=null}}
function auth(path,body){return fetch(SUPABASE_URL+'/auth/v1/'+path,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.msg||j.error_description||j.message||('خطأ '+r.status));return j})})}
function setSess(j){S={at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000-60000,email:(j.user&&j.user.email)||''};save()}
function fresh(){if(!S)return Promise.reject(new Error('nosession'));if(Date.now()<S.exp)return Promise.resolve();return auth('token?grant_type=refresh_token',{refresh_token:S.rt}).then(setSess)}
function api(path,opt){opt=opt||{};return fresh().then(function(){var h={apikey:KEY,Authorization:'Bearer '+S.at,'Content-Type':'application/json'};if(opt.prefer)h.Prefer=opt.prefer;return fetch(SUPABASE_URL+'/rest/v1/'+path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined})}).then(function(r){if(r.status===401){S=null;save();show();throw new Error('انتهت الجلسة')}if(!r.ok)return r.text().then(function(t){throw new Error(t||r.status)});return r.status===204?null:r.json()})}

function show(){var ok=!!S;$('login').hidden=ok;$('app').hidden=!ok;$('out').hidden=!ok;if(ok){refreshCounts();render()}}
$('sw').onclick=function(){signup=!signup;$('lt').textContent=signup?'إنشاء حساب المدير (مرة وحدة)':'تسجيل دخول المدير';$('go').textContent=signup?'أنشئ الحساب':'دخول';$('sw').textContent=signup?'عندي حساب، أبي أدخل':'أنشئ حساب المدير';$('pw').autocomplete=signup?'new-password':'current-password';$('lm').textContent=''};
$('go').onclick=function(){var e=$('em').value.trim(),p=$('pw').value;$('lm').className='msg';if(!e||p.length<8){$('lm').className='msg err';$('lm').textContent='اكتب الإيميل وكلمة مرور 8 أحرف أو أكثر';return}
  $('go').disabled=true;$('lm').textContent='لحظة…';
  (signup?auth('signup',{email:e,password:p}).then(function(j){if(j.access_token){setSess(j);show()}else{$('lm').textContent='تم! افتح إيميلك واضغط رابط التأكيد، بعدها ارجع هنا وسجّل دخول.';$('sw').click()}})
  :auth('token?grant_type=password',{email:e,password:p}).then(function(j){setSess(j);$('pw').value='';show()}))
  .catch(function(x){$('lm').className='msg err';var m=String(x.message||x);if(/confirm/i.test(m))m='لازم تأكد إيميلك أول من الرابط اللي وصلك';else if(/invalid/i.test(m))m='الإيميل أو كلمة المرور غلط';$('lm').textContent=m})
  .then(function(){$('go').disabled=false})};
$('out').onclick=function(){S=null;save();show()};
$('tabs').onclick=function(e){var b=e.target.closest('button');if(!b)return;tab=b.dataset.t;[].forEach.call($('tabs').children,function(x){x.classList.toggle('on',x===b)});render()};

function cnt(path){return fresh().then(function(){return fetch(SUPABASE_URL+'/rest/v1/'+path,{method:'HEAD',headers:{apikey:KEY,Authorization:'Bearer '+S.at,Prefer:'count=exact'}})}).then(function(r){var c=r.headers.get('content-range')||'';return +(c.split('/')[1]||0)})}
function refreshCounts(){cnt('questions?status=eq.pending&select=id').then(function(n){$('nq').textContent=n});cnt('answers?status=eq.pending&select=id').then(function(n){$('na').textContent=n});cnt('reports?handled=eq.false&select=id').then(function(n){$('nr').textContent=n})}

function render(){var L=$('list');L.innerHTML='<div class="empty">جاري التحميل…</div>';var p;
  if(tab==='q')p=api('questions?status=eq.pending&order=created_at.asc&limit=100').then(function(r){return r.map(qCard)});
  else if(tab==='a')p=api('answers?status=eq.pending&order=created_at.asc&limit=100&select=*,questions(body,city)').then(function(r){return r.map(aCard)});
  else if(tab==='r')p=api('reports?handled=eq.false&order=created_at.desc&limit=100').then(rCards);
  else p=api('questions?status=eq.approved&order=created_at.desc&limit=50').then(function(r){return r.map(function(q){return qCard(q,true)})});
  p.then(function(h){L.innerHTML=h.length?h.join(''):'<div class="empty">ما فيه شي ينتظرك هنا 👌</div>'}).catch(function(x){L.innerHTML='<div class="empty err">'+esc(x.message)+'</div>'})}

function qCard(q,live){return '<div class="card" data-k="questions" data-id="'+q.id+'"><div class="meta"><span class="chip">'+esc(q.city)+'</span><span class="chip">'+esc(CAT[q.category]||q.category)+'</span><span>'+esc(q.author_name||'بدون اسم')+'</span><span>'+ago(q.created_at)+'</span>'+(live?'<span>👍 '+q.helpful+'</span>':'')+'</div><p class="body">'+esc(q.body)+'</p><div class="row">'+(live?'<button class="no" data-s="rejected">إخفاء</button>':'<button class="ok" data-s="approved">موافقة ✓</button><button class="no" data-s="rejected">رفض</button>')+'<button class="ghost" data-del="1">حذف</button></div></div>'}
function aCard(a){var q=a.questions||{};return '<div class="card" data-k="answers" data-id="'+a.id+'"><div class="q">سؤال ('+esc(q.city||'')+'): '+esc(q.body||'')+'</div><div class="meta"><span>'+esc(a.author_name||'بدون اسم')+'</span>'+(a.author_city?'<span class="chip">من '+esc(a.author_city)+'</span>':'')+(a.is_local?'<span class="chip">يقول إنه من أهل المدينة</span>':'')+'<span>'+ago(a.created_at)+'</span></div><p class="body">'+esc(a.body)+'</p><div class="row"><button class="ok" data-s="approved">موافقة ✓</button><button class="no" data-s="rejected">رفض</button><button class="ghost" data-del="1">حذف</button></div></div>'}
function rCards(rs){if(!rs.length)return [];var qi=[],ai=[];rs.forEach(function(r){(r.target_type==='answer'?ai:qi).push(r.target_id)});
  return Promise.all([qi.length?api('questions?id=in.('+qi.join(',')+')&select=id,body,city,status'):[],ai.length?api('answers?id=in.('+ai.join(',')+')&select=id,body,status'):[]]).then(function(x){var m={};x[0].concat(x[1]).forEach(function(o){m[o.id]=o});
  return rs.map(function(r){var t=m[r.target_id]||{};var k=r.target_type==='answer'?'answers':'questions';return '<div class="card" data-k="'+k+'" data-id="'+r.target_id+'" data-rep="'+r.id+'"><div class="meta"><span class="chip">بلاغ على '+(k==='answers'?'إجابة':'سؤال')+'</span><span>'+ago(r.created_at)+'</span>'+(t.status?'<span>الحالة: '+esc(t.status)+'</span>':'<span>محذوف</span>')+'</div>'+(r.reason?'<div class="q">السبب: '+esc(r.reason)+'</div>':'')+'<p class="body">'+esc(t.body||'—')+'</p><div class="row">'+(t.status?'<button class="no" data-s="rejected">إخفاء المحتوى</button>':'')+'<button data-done="1">تجاهل البلاغ</button></div></div>'})})}

$('list').onclick=function(e){var b=e.target.closest('button');if(!b)return;var c=b.closest('.card');var k=c.dataset.k,id=c.dataset.id,rep=c.dataset.rep;var p;
  if(b.dataset.del){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='متأكد؟ اضغط مرة ثانية';b.className='no';return}p=api(k+'?id=eq.'+id,{method:'DELETE'})}
  else if(b.dataset.s){p=api(k+'?id=eq.'+id,{method:'PATCH',body:{status:b.dataset.s},prefer:'return=minimal'})}
  else p=Promise.resolve();
  if(rep)p=p.then(function(){return api('reports?id=eq.'+rep,{method:'PATCH',body:{handled:true},prefer:'return=minimal'})});
  [].forEach.call(c.querySelectorAll('button'),function(x){x.disabled=true});
  p.then(function(){c.style.opacity='.35';setTimeout(function(){c.remove();if(!$('list').children.length)render()},250);refreshCounts()}).catch(function(x){var m=document.createElement('div');m.className='msg err';m.textContent=x.message;c.appendChild(m);[].forEach.call(c.querySelectorAll('button'),function(x){x.disabled=false})})};

load();show();
</script>
</body>
</html>
