<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة دليل السعودية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
.geo{position:relative}
.geo .map{height:280px;border-radius:16px;margin-top:8px;border:1.5px solid var(--line);z-index:1}
.sug{position:absolute;top:46px;right:0;left:0;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(43,39,69,.18);z-index:5;overflow:hidden;display:none}
.sug div{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--chip)}
.sug div:hover{background:var(--chip)}
.sug b{display:block;font-size:14px}.sug span{font-size:12px;color:var(--muted)}
:root{--ink:#2B2745;--muted:#6B6585;--faint:#9C94B5;--purple:#604C87;--lilac:#8E65AB;--orange:#F89743;--orangeDeep:#E07B22;--pink:#EB839B;--pinkDeep:#C9506F;--sky:#62B9E8;--skyDeep:#2E86B8;--green:#3E8E5A;--bg:#F4F1EE;--line:#E2DAEC;--chip:#F1ECF6;--white:#fff;--softPurple:#ECE5F3;--softOrange:#FDE7D3;--softPink:#FBE3EA;--softGreen:#E2F0E6;--softSky:#E2F1FA}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--purple)}
.app{display:flex;min-height:100vh}
aside{width:230px;background:var(--ink);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font-weight:700;font-size:17px}
.brand i{width:36px;height:36px;border-radius:11px;background:var(--orange);display:grid;place-items:center;font-style:normal}
.nav{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;cursor:pointer;color:#CFC6DE;font-weight:600;border:0;background:none;text-align:right;width:100%}
.nav:hover{background:rgba(255,255,255,.07)}
.nav.on{background:var(--orange);color:#fff}
.nav b{margin-inline-start:auto;background:var(--pinkDeep);color:#fff;border-radius:999px;padding:0 8px;font-size:12px}
aside .foot{margin-top:auto;font-size:12px;color:#9C94B5;padding:8px}
main{flex:1;min-width:0;padding:26px 28px 80px}
h1{font-size:26px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat{background:#fff;border-radius:20px;padding:16px}
.stat .n{font-size:28px;font-weight:700}
.stat .l{color:var(--muted);font-size:13px}
.card{background:#fff;border-radius:20px;padding:16px}
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:700;cursor:pointer;background:var(--purple);color:#fff;white-space:nowrap}
.btn.o{background:var(--orange)}.btn.g{background:var(--green)}.btn.p{background:var(--pinkDeep)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.in,select.in,textarea.in{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;width:100%;outline:none}
.in:focus{border-color:var(--lilac)}
textarea.in{min-height:130px;resize:vertical;line-height:1.8}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters .in{width:auto;min-width:150px}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:10px;cursor:pointer;border:2px solid transparent}
.item:hover{border-color:var(--line)}
.item img,.item .ph{width:64px;height:64px;border-radius:14px;object-fit:cover;background:var(--chip);flex-shrink:0;display:grid;place-items:center;color:var(--faint);font-size:12px}
.item .t{font-weight:700}
.item .m{color:var(--muted);font-size:13px}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.b-live{background:var(--softGreen);color:var(--green)}.b-draft{background:var(--softOrange);color:var(--orangeDeep)}.b-hidden{background:var(--chip);color:var(--muted)}
.b-panel{background:var(--softPurple);color:var(--purple)}
.tabs{display:flex;gap:6px;background:#fff;border-radius:14px;padding:4px;width:fit-content;margin-bottom:14px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:10px;font-weight:700;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--purple);color:#fff}
.drawer{position:fixed;inset:0;background:rgba(43,39,69,.45);display:none;z-index:20}
.drawer.on{display:block}
.sheet{position:absolute;top:0;bottom:0;left:0;width:min(720px,100%);background:var(--bg);overflow:auto;padding:22px 24px 120px;box-shadow:0 0 40px rgba(0,0,0,.2)}
.sheet h2{margin:0;font-size:22px}
.f{display:grid;gap:6px;margin-top:14px}
.f label{font-weight:700;font-size:13px}
.f small{color:var(--muted);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:var(--purple);border-color:var(--purple);color:#fff}
.imgs{display:flex;gap:8px;flex-wrap:wrap}
.imgs .im{position:relative;width:110px;height:84px;border-radius:12px;overflow:hidden;background:var(--chip)}
.imgs .im img{width:100%;height:100%;object-fit:cover}
.imgs .im .x{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:rgba(0,0,0,.6);color:#fff;border:0;cursor:pointer}
.imgs .im .cover{position:absolute;bottom:4px;right:4px;background:var(--orange);color:#fff;font-size:11px;border-radius:999px;padding:0 8px;font-weight:700}
.imgs .im .mk{position:absolute;bottom:4px;right:4px;background:rgba(255,255,255,.85);border:0;border-radius:999px;font-size:11px;padding:0 8px;cursor:pointer}
.up{font:inherit;line-height:1.5;width:110px;height:84px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:13px;background:#fff}
.bar{position:sticky;bottom:-120px;margin:22px -24px -120px;padding:14px 24px 24px;background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:8px;flex-wrap:wrap}
.im[draggable=true]{cursor:grab}.im.dragging{opacity:.4}.im.over{outline:3px solid var(--orange)}
.warn{background:var(--softOrange);color:var(--orangeInk,#995306);border-radius:14px;padding:10px 14px;font-size:13px;margin-top:10px}
.warn a{color:inherit;font-weight:700}
.prev{background:#fff;border-radius:22px;overflow:hidden;max-width:340px;box-shadow:0 8px 30px rgba(43,39,69,.12);margin-top:10px}
.prev .cv{height:170px;background:var(--chip) center/cover;position:relative}
.prev .cv b{position:absolute;bottom:10px;right:10px;background:#fff;border-radius:999px;padding:2px 10px;font-size:12px}
.prev .bd{padding:14px}.prev h3{margin:0;font-size:19px}.prev p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.8}
.mini{border:0;border-radius:10px;padding:5px 12px;font-weight:700;cursor:pointer;font-size:13px}
.season{background:#fff;border-radius:20px;padding:16px;cursor:pointer;border-right:6px solid var(--purple)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:600;z-index:50;display:none}
.empty{color:var(--muted);text-align:center;padding:40px}
.login{max-width:380px;margin:12vh auto;background:#fff;border-radius:26px;padding:28px;text-align:center}
.login i{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:20px;background:var(--purple);color:#fff;font-style:normal;font-size:28px;margin-bottom:10px}
.post{background:#fff;border-radius:18px;padding:14px;display:grid;gap:8px}
.muted{color:var(--muted)}
.tag{font-size:12px;color:var(--skyDeep);font-weight:700}
.hint{background:var(--softPurple);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--purple)}
@media (max-width:820px){
  .msgGrid{grid-template-columns:1fr!important}
  .app{flex-direction:column}
  aside{width:auto;height:auto;position:sticky;top:0;z-index:10;flex-direction:row;overflow-x:auto;padding:10px;gap:4px}
  .brand,aside .foot{display:none}
  .nav{width:auto;white-space:nowrap;padding:8px 12px}
  main{padding:18px 16px 80px}
  .two{grid-template-columns:1fr}
  .sheet{padding:18px 16px 120px}
  .bar{margin:22px -16px -120px;padding:14px 16px 24px}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
const API = location.origin;
const KIND = { islamic: 'معالم إسلامية', heritage: 'تراث وثقافة', nature: 'طبيعة', sights: 'معالم سياحية', fun: 'ترفيه', food: 'مطاعم', cafe: 'مقاهي', shopping: 'تسوق' };
const ST = { live: ['منشور', 'b-live'], draft: ['مسودة', 'b-draft'], hidden: ['مخفي', 'b-hidden'] };
const EV_TYPES = ['حفلات غنائية', 'مسرح', 'رياضية', 'مهرجانات', 'معارض ومؤتمرات', 'تراث وثقافة', 'ترفيه', 'تجارب ومغامرات', 'عائلية', 'طعام'];
const SEASONS = ['موسم الرياض', 'موسم جدة', 'موسم الدرعية', 'لحظات العلا'];
let KEY = localStorage.getItem('sg_admin') || '';
let META = null, VIEW = 'home', SUMMARY = null;
const $ = (s, el = document) => el.querySelector(s);
const h = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cityName = (id) => META?.cities.find((c) => c.id === id)?.name || id || '—';
function toast(t) { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => (el.style.display = 'none'), 2600); }

async function api(path, opt = {}) {
  const r = await fetch(API + path, { method: opt.method || 'GET', headers: { 'X-Admin-Key': KEY, ...(opt.body && !(opt.body instanceof Blob) ? { 'Content-Type': 'application/json' } : {}), ...(opt.headers || {}) }, body: opt.body instanceof Blob ? opt.body : opt.body ? JSON.stringify(opt.body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { const wasIn = !!localStorage.getItem('sg_admin'); KEY = ''; localStorage.removeItem('sg_admin'); if (wasIn) render(); throw new Error('unauthorized'); }
  if (!r.ok) throw new Error(d.error || 'http_' + r.status);
  return d;
}
const ERR = { text_required: 'اكتب الرسالة', title_required: 'اكتب الاسم', start_required: 'حدد تاريخ البداية', bad_city: 'اختر المدينة', bad_type: 'الصورة لازم JPG أو PNG أو WEBP', bad_size: 'الصورة أكبر من 10MB', bad_time: 'الوقت لازم يكون بعد الحين', no_channel: 'اختر قناة وحدة على الأقل' };
const errMsg = (e) => ERR[e.message] || 'صار خطأ: ' + e.message;

/* ——— الدخول ——— */
function loginView() {
  $('#root').innerHTML = `<div class="login"><i>د</i><h1 style="font-size:22px">لوحة دليل السعودية</h1>
    <p class="sub">اضغط الزر البرتقالي عشان يلصق مفتاح الإدارة اللي نسخه لك أمر «افتح-اللوحة».</p>
    <button class="btn o" style="width:100%;padding:14px;font-size:17px" id="paste">الصق المفتاح وادخل</button>
    <p class="muted" style="margin:16px 0 8px;font-size:13px">أو الصقه يدوياً هنا (Cmd+V):</p>
    <input class="in" id="k" type="password" placeholder="مفتاح الإدارة" autocomplete="off" autofocus>
    <button class="btn" style="width:100%;margin-top:10px" id="go">دخول</button><p id="msg" style="color:var(--pinkDeep);font-weight:700"></p></div>`;
  const go = async (k) => {
    const raw = String(k || $('#k').value);
    // المفتاح حروف وأرقام إنجليزية بس — نطلعه حتى لو انلصق معه كلام ثاني
    KEY = (raw.match(/[A-Za-z0-9_-]{8,}/) || [''])[0];
    if (!raw.trim()) { $('#msg').textContent = 'ما فيه شي منسوخ. شغّل أمر «افتح-اللوحة» مرة ثانية، وبعده لا تنسخ أي شي ثاني'; return; }
    if (!KEY) { $('#msg').textContent = 'اللي منسوخ مو المفتاح (غالباً نسخت شي بعد الأمر). شغّل أمر «افتح-اللوحة» مرة ثانية، وبعده اضغط الزر البرتقالي على طول'; return; }
    try { await api('/admin/summary'); localStorage.setItem('sg_admin', KEY); render(); }
    catch (e) { KEY = ''; $('#msg').textContent = e.message === 'unauthorized' ? 'المفتاح غلط. شغّل أمر «افتح-اللوحة» مرة ثانية' : 'السيرفر ما رد: ' + e.message; }
  };
  $('#paste').onclick = async () => {
    try { const t = await navigator.clipboard.readText(); go(t); }
    catch { $('#msg').textContent = 'المتصفح ما سمح باللصق. اضغط داخل الخانة تحت واضغط Cmd+V'; $('#k').focus(); }
  };
  $('#go').onclick = () => go(); $('#k').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  setTimeout(() => $('#k').focus(), 100);
}

/* ——— الهيكل ——— */
const NAV = [['home', 'الرئيسية'], ['places', 'الأماكن'], ['events', 'الفعاليات'], ['seasons', 'المواسم'], ['weekly', 'مختارات الأسبوع'], ['articles', 'الأخبار'], ['community', 'المجتمع'], ['merchants', 'التجار والكوبونات'], ['photos', 'صور وتقييمات'], ['messages', 'الرسائل'], ['badges', 'الأوسمة والنقاط'], ['analytics', 'التحليلات'], ['users', 'المستخدمين']];
async function render() {
  if (!KEY) return loginView();
  if (!META) { try { META = await api('/admin/meta'); } catch (e) { if (KEY) $('#root').innerHTML = `<div class="login"><p>ما قدرنا نحمّل اللوحة (${h(e.message)}). حدّث الصفحة.</p></div>`; return; } }
  const rep = SUMMARY?.counts?.reported || 0;
  const NB = { community: rep, merchants: (SUMMARY?.counts?.merchantsPending || 0) + (SUMMARY?.counts?.couponsPending || 0), photos: (SUMMARY?.counts?.photosPending || 0) + (SUMMARY?.counts?.reviewsReported || 0), users: SUMMARY?.counts?.guidesPending || 0 };
  $('#root').innerHTML = `<div class="app"><aside><div class="brand"><i>د</i>لوحة الدليل</div>
    ${NAV.map(([id, t]) => `<button class="nav ${VIEW === id ? 'on' : ''}" data-v="${id}">${t}${NB[id] ? `<b>${NB[id]}</b>` : ''}</button>`).join('')}
    <div class="foot">كل وقت بتوقيت مكة<br><a href="#" id="out" style="color:#CFC6DE">خروج</a></div></aside><main id="main"></main></div>`;
  document.querySelectorAll('.nav').forEach((b) => (b.onclick = () => { VIEW = b.dataset.v; render(); }));
  $('#out').onclick = (e) => { e.preventDefault(); KEY = ''; localStorage.removeItem('sg_admin'); render(); };
  ({ home: homeView, places: placesView, events: eventsView, seasons: seasonsView, weekly: weeklyView, articles: articlesView, community: communityView, merchants: merchantsView, photos: photosView, messages: messagesView, badges: badgesView, analytics: analyticsView, users: usersView })[VIEW]();
  if (!SUMMARY && VIEW !== 'home') api('/admin/summary').then((x) => { SUMMARY = x; }).catch(() => {});
}

/* ——— الرئيسية ——— */
async function homeView() {
  const m = $('#main');
  m.innerHTML = '<p class="muted">لحظة...</p>';
  SUMMARY = await api('/admin/summary');
  const c = SUMMARY.counts;
  const S = (n, l, color, go) => `<div class="stat" ${go ? `data-go="${go}" style="cursor:pointer"` : ''}><div class="n" style="color:${color}">${n}</div><div class="l">${l}</div></div>`;
  m.innerHTML = `<h1>أهلاً رامي</h1><p class="sub">هذي لوحتك: أي شي تضيفه أو تعدّله هنا يوصل للتطبيق خلال دقائق.</p>
    <div class="row" style="margin-bottom:18px"><button class="btn o" id="addP">+ مكان جديد</button><button class="btn" id="addE">+ فعالية جديدة</button></div>
    <div class="stats">${S(c.places, 'مكان منشور', 'var(--purple)', 'places')}${S(c.drafts, 'مسودة تنتظر النشر', 'var(--orangeDeep)', 'drafts')}${S(c.events, 'فعالية قادمة', 'var(--skyDeep)', 'events')}
    ${S(c.reported, 'بلاغ يحتاج مراجعة', 'var(--pinkDeep)', 'community')}${S(c.users, 'مستخدم مسجّل', 'var(--green)', 'users')}${S(c.posts + ' / ' + c.answers, 'سؤال / إجابة', 'var(--lilac)', 'community')}
    ${c.merchantsPending + c.couponsPending ? S(c.merchantsPending + ' / ' + c.couponsPending, 'طلب تاجر / كوبون ينتظر', 'var(--pinkDeep)', 'merchants') : ''}${c.photosPending ? S(c.photosPending, 'صورة زوار تنتظر', 'var(--orangeDeep)', 'photos') : ''}${S(c.noPhoto, 'مكان بدون صورة', 'var(--muted)', 'nophoto')}${S(c.noGeo, 'مكان بدون موقع', 'var(--muted)', 'nogeo')}</div>
    <div class="card"><b>آخر مشاركات المجتمع</b><div class="list" style="margin-top:10px">${SUMMARY.recent.map((r) => `<div class="m">${h(r.name || 'مستخدم')} · ${h(r.text.slice(0, 90))}</div>`).join('') || '<div class="muted">ما فيه مشاركات للحين</div>'}</div></div>`;
  $('#addP').onclick = () => editPlace(null);
  $('#addE').onclick = () => editEvent(null);
  m.querySelectorAll('[data-go]').forEach((el) => (el.onclick = () => {
    const g = el.dataset.go;
    if (g === 'drafts') { PF.status = 'draft'; VIEW = 'places'; } else if (g === 'nophoto') { PF.missing = 'photo'; VIEW = 'places'; } else if (g === 'nogeo') { PF.missing = 'geo'; VIEW = 'places'; } else VIEW = g;
    render();
  }));
}

/* ——— الأماكن ——— */
const PF = { city: '', status: '', q: '', missing: '', page: 1 };
async function placesView() {
  const m = $('#main');
  m.innerHTML = `<div class="row"><div class="grow"><h1>الأماكن</h1><p class="sub">الأماكن الجديدة تنحفظ مسودة، وما تظهر في التطبيق لين تضغط «انشر».</p></div><button class="btn o" id="add">+ مكان جديد</button></div>
    <div class="filters"><input class="in" id="q" placeholder="ابحث بالاسم أو الرقم" value="${h(PF.q)}">
    <select class="in" id="city"><option value="">كل المدن</option>${META.cities.map((c) => `<option value="${c.id}" ${PF.city === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}</select>
    <select class="in" id="status"><option value="">كل الحالات</option>${Object.entries(ST).map(([k, v]) => `<option value="${k}" ${PF.status === k ? 'selected' : ''}>${v[0]}</option>`).join('')}</select>
    <select class="in" id="missing"><option value="">بدون فلتر</option><option value="photo" ${PF.missing === 'photo' ? 'selected' : ''}>بدون صورة</option><option value="geo" ${PF.missing === 'geo' ? 'selected' : ''}>بدون موقع</option></select></div>
    <div id="res" class="list"><p class="muted">لحظة...</p></div>`;
  $('#add').onclick = () => editPlace(null);
  let t; $('#q').oninput = (e) => { clearTimeout(t); t = setTimeout(() => { PF.q = e.target.value; PF.page = 1; loadPlaces(); }, 350); };
  ['city', 'status', 'missing'].forEach((k) => ($('#' + k).onchange = (e) => { PF[k] = e.target.value; PF.page = 1; loadPlaces(); }));
  loadPlaces();
}
async function loadPlaces() {
  const qs = new URLSearchParams(Object.entries(PF).filter(([, v]) => v)).toString();
  const d = await api('/admin/places?' + qs);
  const pages = Math.ceil(d.total / 30);
  $('#res').innerHTML = `<div class="muted" style="font-size:13px">${d.total} مكان</div>` + (d.places.map((p) => `<div class="item" data-id="${p.id}">
    ${p.thumb ? `<img src="${h(p.thumb)}" loading="lazy">` : '<div class="ph">بدون صورة</div>'}
    <div class="grow"><div class="t">${h(p.title)}</div><div class="m">${cityName(p.city)} · ${p.kinds.map((k) => KIND[k] || k).join('، ') || 'بدون تصنيف'}${!p.lat ? ' · <span style="color:var(--pinkDeep)">بدون موقع</span>' : ''}</div></div>

  e = e || { title: '', summary: '', body: '', images: [], start: '', end: '', all_day: false, cats: [], city: '', lat: null, lng: null, address: '', tickets: '', link: '', status: 'draft' };
  const images = [...e.images], cats = [...e.cats];
  const d = drawer(`<div class="row"><div class="grow"><h2>${isNew ? 'فعالية جديدة' : h(e.title)}</h2><div class="m muted">${isNew ? 'بتنحفظ مسودة' : `رقم ${e.id} · <span class="badge ${ST[e.status][1]}">${ST[e.status][0]}</span>`}</div></div><button class="btn ghost" id="x">إغلاق</button></div>
    <div class="f"><label>اسم الفعالية *</label><input class="in" id="title" value="${h(e.title)}"></div>
    <div class="two"><div class="f"><label>تبدأ * (بتوقيت مكة)</label><input class="in" type="datetime-local" id="start" value="${toLocal(e.start)}"></div><div class="f"><label>تنتهي</label><input class="in" type="datetime-local" id="end" value="${toLocal(e.end)}"></div></div>
    <div class="f"><label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="all_day" ${e.all_day ? 'checked' : ''}> طول اليوم (بدون ساعة محددة)</label></div>
    <div class="f"><label>الموسم</label><div id="season"></div><small>الفعاليات اللي تحمل اسم الموسم تطلع في صفحته في التطبيق</small></div>
    <div class="f"><label>النوع</label><div id="cats"></div></div>
    <div class="f"><label>الصور</label><div id="imgs"></div></div>
    <div class="f"><label>وصف قصير</label><input class="in" id="summary" value="${h(e.summary)}" maxlength="400"></div>
    <div class="f"><label>التفاصيل</label><textarea class="in" id="body">${h(plainBody(e.body))}</textarea></div>
    <div class="two"><div class="f"><label>المدينة</label><select class="in" id="city"><option value="">تلقائي من الموقع</option>${META.cities.map((c) => `<option value="${c.id}" ${e.city === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}</select></div>
    <div class="f"><label>المكان (العنوان)</label><input class="in" id="address" value="${h(e.address)}" placeholder="بوليفارد سيتي، الرياض"><small>أول جزء قبل الفاصلة يصير «منطقة الموسم»</small></div></div>
    <div class="f"><label>الموقع على الخريطة</label><div id="geoBox"></div></div>
    <div class="two"><div class="f"><label>رابط التذاكر</label><input class="in" id="tickets" dir="ltr" value="${h(e.tickets)}"></div><div class="f"><label>رابط الفعالية</label><input class="in" id="link" dir="ltr" value="${h(e.link)}"></div></div>
    <div class="bar"><button class="btn" id="save">حفظ</button>${e.status !== 'live' ? '<button class="btn g" id="pub">حفظ وانشر</button>' : '<button class="btn ghost" id="unpub">رجّعها مسودة</button>'}
      ${!isNew && e.status !== 'hidden' ? '<button class="btn ghost" id="hide" style="color:var(--pinkDeep)">إخفاء</button>' : ''}${!isNew ? '<button class="btn ghost" id="dup">نسخة منها</button>' : ''}</div>`);
  imagesWidget($('#imgs', d), images);
  const seasonSel = cats.filter((c) => /^(موسم|لحظات)/.test(c)), typeSel = cats.filter((c) => !/^(موسم|لحظات)/.test(c));
  chipsWidget($('#season', d), [...new Set([...SEASONS, ...META.eventCats.filter((c) => /^(موسم|لحظات)/.test(c))])], seasonSel, true);
  chipsWidget($('#cats', d), [...new Set([...EV_TYPES, ...META.eventCats.filter((c) => !/^(موسم|لحظات)/.test(c))])], typeSel, true);
  geoWidget($('#geoBox', d), e.lat, e.lng, () => $('#city', d).value, $('#address', d));
  $('#x', d).onclick = closeDrawer;
  const collect = () => { const g = parseGeo($('#geo', d).value); return { title: $('#title', d).value, start: fromLocal($('#start', d).value), end: fromLocal($('#end', d).value), all_day: $('#all_day', d).checked, cats: [...seasonSel, ...typeSel], images, summary: $('#summary', d).value, body: $('#body', d).value, city: $('#city', d).value, address: $('#address', d).value, lat: g?.[0] ?? null, lng: g?.[1] ?? null, tickets: $('#tickets', d).value, link: $('#link', d).value }; };
  const save = async (status, asNew) => {
    try {
      const r = await api(isNew || asNew ? '/admin/events' : '/admin/events/' + e.id, { method: isNew || asNew ? 'POST' : 'PUT', body: collect() });
      if (status) await api(`/admin/events/${r.event.id}/status`, { method: 'POST', body: { status } });
      toast(asNew ? 'انحفظت نسخة جديدة كمسودة' : status === 'live' ? 'انحفظت وانتشرت' : 'انحفظت'); closeDrawer(); VIEW === 'events' ? loadEvents() : render();
      if (asNew) editEvent(r.event);
    } catch (er) { toast(errMsg(er)); }
  };
  $('#save', d).onclick = () => save();
  $('#pub', d) && ($('#pub', d).onclick = () => save('live'));
  $('#unpub', d) && ($('#unpub', d).onclick = () => save('draft'));
  $('#dup', d) && ($('#dup', d).onclick = () => save(null, true));
  $('#hide', d) && ($('#hide', d).onclick = async () => { if (!confirm('تخفي الفعالية من التطبيق؟')) return; await api(`/admin/events/${e.id}/status`, { method: 'POST', body: { status: 'hidden' } }); toast('انخفت'); closeDrawer(); VIEW === 'events' ? loadEvents() : render(); });
}

/* ——— المواسم ——— */
const SEASON_COLOR = { 'موسم الرياض': 'var(--purple)', 'موسم جدة': 'var(--skyDeep)', 'موسم الدرعية': 'var(--orangeDeep)', 'لحظات العلا': 'var(--pinkDeep)' };
async function seasonsView() {
  const m = $('#main');
  m.innerHTML = `<div class="row"><div class="grow"><h1>المواسم</h1><p class="sub">الموسم يتكوّن من الفعاليات اللي تحمل اسمه. أضف فعالية واختر الموسم، وتطلع تلقائياً في صفحته في التطبيق.</p></div><button class="btn o" id="add">+ فعالية لموسم</button></div><div id="res" class="list"><p class="muted">لحظة...</p></div>`;
  $('#add').onclick = () => editEvent(null);
  const d = await api('/admin/seasons');
  const now = new Date().toISOString();
  $('#res').innerHTML = d.seasons.map((x) => {
    const st = x.end < now ? 'انتهى' : x.start > now ? 'يبدأ ' + fmt(x.start) : 'شغّال الحين';
    return `<div class="season" data-n="${h(x.name)}" style="border-right-color:${SEASON_COLOR[x.name] || 'var(--lilac)'}"><div class="row"><b class="grow" style="font-size:18px">${h(x.name)}</b><span class="badge ${x.end < now ? 'b-hidden' : 'b-live'}">${st}</span></div>
      <div class="m muted" style="margin-top:6px">${x.live} فعالية منشورة${x.drafts ? ` · ${x.drafts} مسودة` : ''} · من ${fmt(x.start)} إلى ${fmt(x.end)}</div></div>`;
  }).join('') || '<div class="empty">ما فيه مواسم. أضف فعالية واختر لها موسم.</div>';
  m.querySelectorAll('[data-n]').forEach((el) => (el.onclick = () => { EF.q = el.dataset.n; EF.when = 'all'; VIEW = 'events'; render(); }));
}

/* ——— مختارات الأسبوع ——— */
const SEAS = { a: 'طول السنة', w: 'الشتاء', s: 'الصيف' };
async function weeklyView() {
  const m = $('#main');
  m.innerHTML = '<p class="muted">لحظة...</p>';
  const d = await api('/admin/weekly');
  const pool = d.pool;
  const draw = () => {
    m.innerHTML = `<div class="row"><div class="grow"><h1>مختارات الأسبوع</h1><p class="sub">قائمة الأماكن اللي يختار منها التطبيق كل أسبوع 5 أماكن من مدن مختلفة. المميّزة ★ تطلع أول. «الشتاء» تطلع من نوفمبر لمارس، و«الصيف» من مايو لسبتمبر.</p></div><button class="btn g" id="saveW">حفظ القائمة</button></div>
      <div class="card" style="margin-bottom:14px"><b>أضف مكان</b><input class="in" id="wq" placeholder="ابحث باسم المكان" style="margin-top:8px"><div id="wres" class="list" style="margin-top:8px"></div></div>
      <div class="muted" style="font-size:13px;margin-bottom:8px">${pool.length} مكان في القائمة</div>
      <div class="list">${pool.map((x, i) => `<div class="item" style="cursor:default">${x.thumb ? `<img src="${h(x.thumb)}" loading="lazy">` : '<div class="ph">بدون صورة</div>'}
        <div class="grow"><div class="t">${x.x ? '★ ' : ''}${h(x.title)}</div><div class="m">${cityName(x.city)}${x.status !== 'live' ? ' · <span style="color:var(--pinkDeep)">مو منشور</span>' : ''}</div></div>
        <select class="in" style="width:auto" data-s="${i}">${Object.entries(SEAS).map(([k, v]) => `<option value="${k}" ${x.s === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
        <button class="mini" style="background:var(--softOrange);color:var(--orangeDeep)" data-x="${i}">${x.x ? 'شيل التمييز' : '★ ميّزه'}</button>
        <button class="mini" style="background:var(--chip);color:var(--pinkDeep)" data-r="${i}">شيل</button></div>`).join('')}</div>`;
    m.querySelectorAll('[data-s]').forEach((el) => (el.onchange = () => { pool[+el.dataset.s].s = el.value; }));
    m.querySelectorAll('[data-x]').forEach((el) => (el.onclick = () => { const x = pool[+el.dataset.x]; x.x ? delete x.x : (x.x = 1); draw(); }));
    m.querySelectorAll('[data-r]').forEach((el) => (el.onclick = () => { pool.splice(+el.dataset.r, 1); draw(); }));
    $('#saveW').onclick = async () => { await api('/admin/weekly', { method: 'POST', body: { pool: pool.map(({ id, s, x }) => (x ? { id, s, x: 1 } : { id, s })) } }); toast('انحفظت القائمة'); };
    let t; $('#wq').oninput = (e) => { clearTimeout(t); t = setTimeout(async () => {
      const v = e.target.value.trim(); if (v.length < 2) { $('#wres').innerHTML = ''; return; }
      const r = await api('/admin/places?status=live&q=' + encodeURIComponent(v));
      $('#wres').innerHTML = r.places.slice(0, 6).map((p) => `<div class="item" data-add="${p.id}" data-t="${h(p.title)}" data-c="${p.city}" data-th="${h(p.thumb)}"><div class="grow"><div class="t">${h(p.title)}</div><div class="m">${cityName(p.city)}</div></div>${pool.some((x) => x.id === p.id) ? '<span class="badge b-live">موجود</span>' : '<span class="mini" style="background:var(--purple);color:#fff">+ أضف</span>'}</div>`).join('') || '<div class="muted">ما لقيت</div>';
      $('#wres').querySelectorAll('[data-add]').forEach((el) => (el.onclick = () => { const id = +el.dataset.add; if (pool.some((x) => x.id === id)) return; pool.unshift({ id, s: 'a', title: el.dataset.t, city: el.dataset.c, thumb: el.dataset.th, status: 'live' }); draw(); toast('انضاف — اضغط «حفظ القائمة»'); }));
    }, 350); };
  };
  draw();
}

  m.innerHTML = `<div class="row"><div class="grow"><h1>الأخبار والمقالات</h1><p class="sub">آخر 3 أخبار تطلع في الصفحة الرئيسية للتطبيق. الجديد ينحفظ مسودة.</p></div><button class="btn o" id="add">+ خبر جديد</button></div><div id="res" class="list"><p class="muted">لحظة...</p></div>`;
  $('#add').onclick = () => editArticle(null);

    <div class="grow"><div class="t">${h(a.title)}</div><div class="m">${fmt(a.date)}${a.author ? ' · ' + h(a.author) : ''}</div></div><span class="badge ${ST[a.status][1]}">${ST[a.status][0]}</span></div>`).join('') || '<div class="empty">ما فيه أخبار</div>';

function editArticle(a) {
  const isNew = !a;
  a = a || { title: '', author: 'فريق دليل السعودية', date: new Date().toISOString(), summary: '', body: '', images: [], cats: [], status: 'draft' };
  const images = [...a.images];
  const d = drawer(`<div class="row"><div class="grow"><h2>${isNew ? 'خبر جديد' : h(a.title)}</h2><div class="m muted">${isNew ? 'بينحفظ مسودة' : `<span class="badge ${ST[a.status][1]}">${ST[a.status][0]}</span>`}</div></div><button class="btn ghost" id="x">إغلاق</button></div>
    <div class="f"><label>العنوان *</label><input class="in" id="title" value="${h(a.title)}"></div>
    <div class="two"><div class="f"><label>الكاتب</label><input class="in" id="author" value="${h(a.author)}"></div><div class="f"><label>التاريخ</label><input class="in" type="datetime-local" id="date" value="${toLocal(a.date)}"></div></div>
    <div class="f"><label>الصور</label><div id="imgs"></div></div>
    <div class="f"><label>ملخص</label><input class="in" id="summary" value="${h(a.summary)}" maxlength="400"></div>
    <div class="f"><label>النص</label><textarea class="in" id="body" style="min-height:260px">${h(plainBody(a.body))}</textarea><small>سطر فاضي بين الفقرات</small></div>
    <div class="bar"><button class="btn" id="save">حفظ</button>${a.status !== 'live' ? '<button class="btn g" id="pub">حفظ وانشر</button>' : '<button class="btn ghost" id="unpub">رجّعه مسودة</button>'}${!isNew && a.status !== 'hidden' ? '<button class="btn ghost" id="hide" style="color:var(--pinkDeep)">إخفاء</button>' : ''}</div>`);
  imagesWidget($('#imgs', d), images);
  $('#x', d).onclick = closeDrawer;
  const save = async (status) => {
    try {
      const body = { title: $('#title', d).value, author: $('#author', d).value, date: fromLocal($('#date', d).value), summary: $('#summary', d).value, body: $('#body', d).value, images };
      const r = await api(isNew ? '/admin/articles' : '/admin/articles/' + a.id, { method: isNew ? 'POST' : 'PUT', body });
      if (status) await api(`/admin/articles/${r.article.id}/status`, { method: 'POST', body: { status } });
      toast(status === 'live' ? 'انحفظ وانتشر' : 'انحفظ'); closeDrawer(); VIEW === 'articles' ? articlesView() : render();
    } catch (e) { toast(errMsg(e)); }
  };
  $('#save', d).onclick = () => save();
  $('#pub', d) && ($('#pub', d).onclick = () => save('live'));
  $('#unpub', d) && ($('#unpub', d).onclick = () => save('draft'));
  $('#hide', d) && ($('#hide', d).onclick = async () => { if (!confirm('تخفي الخبر؟')) return; await api(`/admin/articles/${a.id}/status`, { method: 'POST', body: { status: 'hidden' } }); toast('انخفى'); closeDrawer(); articlesView(); });
}

/* ——— المجتمع ——— */

      <p class="muted">يطلع بطاقة برتقالية فوق المجتمع. اللي يشارك يضغطها ويكتب مشاركته، وتنحسب المشاركات اللي فيها الوسم.</p>

      <div class="f"><label>الجائزة</label><input class="in" id="prize" value="${h(cur.prize || '')}" placeholder="وسم «عدسة الدليل» + كوبون"></div>
      <div class="two"><div class="f"><label>الوسم (بدون #)</label><input class="in" id="tag" value="${h(cur.tag || '')}" placeholder="غروب_جدة"></div><div class="f"><label>ينتهي</label><input class="in" type="datetime-local" id="end" value="${toLocal(cur.end)}"></div></div>
      <div class="f"><label>صورة البطاقة</label><div id="imgs"></div></div>

    imagesWidget($('#imgs', d), imgs);
    $('#x', d).onclick = closeDrawer;
    $('#save', d).onclick = async () => { await api('/admin/challenge', { method: 'POST', body: { title: $('#title', d).value, prize: $('#prize', d).value, tag: $('#tag', d).value.replace(/^#/, ''), end: fromLocal($('#end', d).value), photo: imgs[0] || '' } }); toast('انحفظ التحدي'); closeDrawer(); };
    $('#stop', d) && ($('#stop', d).onclick = async () => { await api('/admin/challenge', { method: 'POST', body: { clear: true } }); toast('وقف التحدي'); closeDrawer(); });
  };
  const why = { reports: 'انخفت بالبلاغات', owner: 'صاحبها حذفها', admin: 'أنت أخفيتها', account: 'الحساب انحذف' };
  let rows;
  if (CTAB === 'reported') {
    const d = await api('/admin/community/reported');

   <div style="display:grid;gap:14px;align-content:start">
    <div class="card" style="background:var(--ink);color:#fff"><div style="font-size:13px;color:#CFC6DE">معاينة على الجوال</div>
     <div style="margin-top:12px;background:rgba(255,255,255,.12);border-radius:16px;padding:12px;display:flex;gap:10px"><span style="width:36px;height:36px;border-radius:9px;background:var(--purple);display:grid;place-items:center;font-weight:700;flex:none">د</span><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;font-size:12px;color:#CFC6DE"><span>دليل السعودية</span><span>الحين</span></div><div style="font-weight:700" id="pt">دليل السعودية</div><div style="font-size:13px;color:#E2DAEE" id="px">نص الرسالة يطلع هنا</div></div></div></div>
    <div class="card"><b>حماية المستخدم</b><div class="muted" style="font-size:13px;line-height:1.9;margin-top:6px">• ساعات هدوء 11 م – 8 ص: إشعار الجوال يتأجل لـ 8 الصبح، والرسالة داخل التطبيق تنزل على وقتها.<br>• الأجهزة المسجلة الحين: <b>${d.devices}</b>. إشعارات الجوال تشتغل فعلياً بعد النسخة الجاية من التطبيق (تحتاج مفتاح آبل للإشعارات).</div></div>
   </div></div>
  <h2 style="margin:24px 0 10px;font-size:19px">السجل</h2>
  <div class="list">${d.messages.map((x) => `<div class="post"><div class="row"><b class="grow">${h(x.title || x.text.slice(0, 50))}</b><span class="badge ${x.status === 'sent' ? 'b-live' : x.status === 'scheduled' ? 'b-draft' : 'b-hidden'}">${x.status === 'sent' ? 'انرسلت' : x.status === 'scheduled' ? 'مجدولة' : 'ملغية'}</span></div>
    <div class="muted" style="font-size:13px">${h(x.text)}</div>
    <div class="muted" style="font-size:12px">${new Date(x.at * 1000).toLocaleString('ar-SA-u-ca-gregory-nu-latn', { timeZone: 'Asia/Riyadh', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })} · ${(SEG.find((s) => s[0] === x.audience.segment) || ['', 'الكل'])[1]}${x.audience.cities?.length ? ' · ' + x.audience.cities.map(cityName).join('، ') : ''}${x.status === 'sent' || x.sent_inapp ? ` · داخل التطبيق: ${Math.max(0, x.sent_inapp)} · الجوال: ${Math.max(0, x.sent_push)}${x.push_errors ? ` (تعذّر ${x.push_errors})` : ''}` : ''}${x.link ? ' · يفتح ' + h(x.link) : ''}</div>
    ${x.status === 'scheduled' && !x.sent_inapp ? `<div><button class="mini" style="background:var(--softPink);color:var(--pinkDeep)" data-cancel="${x.id}">ألغِ</button></div>` : ''}</div>`).join('') || '<div class="empty">ما أرسلت رسائل للحين</div>'}</div>`;
  const pv = () => { $('#pt').textContent = $('#mt').value || 'دليل السعودية'; $('#px').textContent = $('#mx').value || 'نص الرسالة يطلع هنا'; $('#mxn').textContent = $('#mx').value.length + ' / 178'; };
  $('#mt').oninput = pv; $('#mx').oninput = pv;
  $('#ml').onchange = () => { $('#mlc').style.display = $('#ml').value === 'custom' ? '' : 'none'; };
  $('#mw').onchange = () => { $('#mat').style.display = $('#mw').value === 'later' ? '' : 'none'; };
  const aud = () => ({ segment: $('#ms').value, cities: [...cities] });
  let et; const est = () => { clearTimeout(et); et = setTimeout(async () => { try { const r = await api('/admin/messages/estimate', { method: 'POST', body: aud() }); $('#est').textContent = `توصل تقريباً لـ ${r.users} مستخدم داخل التطبيق، و ${r.devices} جهاز إشعار.`; } catch {} }, 250); };
  $('#ms').onchange = est;
  m.querySelectorAll('#mc [data-c]').forEach((c) => (c.onclick = () => { const id = c.dataset.c; cities.has(id) ? cities.delete(id) : cities.add(id); c.classList.toggle('on'); est(); }));
  est();
  $('#send').onclick = async () => {
    const text = $('#mx').value.trim(); if (text.length < 4) return toast('اكتب نص الرسالة');
    const link = $('#ml').value === 'custom' ? $('#mlc').value.trim() : $('#ml').value;
    if ($('#ml').value === 'custom' && !/^\/[a-z]+\/\d+$/i.test(link)) return toast('الرابط لازم مثل /place/123');
    const later = $('#mw').value === 'later';
    if (later && !$('#mat').value) return toast('حدد الوقت');
    if (!confirm(later ? 'تجدول الرسالة؟' : 'ترسلها الحين؟ ما تقدر ترجعها بعد الإرسال.')) return;
    try {
      const r = await api('/admin/messages', { method: 'POST', body: { title: $('#mt').value, text, link, ...aud(), at: later ? fromLocal($('#mat').value) : '', inapp: $('#cin').checked, push: $('#cpu').checked } });
      toast(r.sent ? `انرسلت: ${r.inapp} داخل التطبيق${r.pushDelayed ? '، وإشعار الجوال الساعة 8 الصبح' : r.push ? '، ' + r.push + ' جوال' : ''}` : 'انجدولت');
      messagesView();
    } catch (e) { toast(errMsg(e)); }
  };
  m.querySelectorAll('[data-cancel]').forEach((b) => (b.onclick = async () => { if (!confirm('تلغي الرسالة المجدولة؟')) return; await api(`/admin/messages/${b.dataset.cancel}/cancel`, { method: 'POST' }); toast('انلغت'); messagesView(); }));
}

/* ——— الأوسمة والنقاط ——— */
async function badgesView() {
  const m = $('#main');
  m.innerHTML = '<p class="muted">لحظة...</p>';
  const d = await api('/admin/badges');
  const max = Math.max(1, ...d.levels.map((l) => l.users));
  m.innerHTML = `<h1>الأوسمة والنقاط</h1><p class="sub">النقاط تجي من المشاركة: سؤال +2، إجابة +5، أفضل إجابة +15، شكر +1، تقييم مكان +3، صورة مقبولة +5، زيارة مؤكدة +10 (ومدينة جديدة +25).</p>
    <div class="stats">${[[d.total, 'مستخدم', 'var(--purple)'], [d.guides, 'مرشد موثّق', 'var(--green)'], [d.badges.reduce((a, b) => a + (b.users || 0), 0), 'وسام محصّل', 'var(--orangeDeep)']].map(([n, l, c]) => `<div class="stat"><div class="n" style="color:${c}">${n}</div><div class="l">${l}</div></div>`).join('')}</div>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px" class="msgGrid">
    <div class="card"><b>الأوسمة</b><div class="list" style="margin-top:10px">${d.badges.map((b) => `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--chip)"><span style="width:38px;height:38px;border-radius:12px;background:var(--softOrange);display:grid;place-items:center;color:var(--orangeDeep);font-weight:700">★</span><div class="grow"><b>${h(b.name)}</b><div class="muted" style="font-size:12px">${({ questions: 'سؤال', tips: 'نصيحة', answers: 'إجابة', best: 'أفضل إجابة', photos: 'صورة', thanks: 'شكر', trip: 'مكان في رحلتي', visits: 'زيارة مؤكدة', cities: 'مدينة مزارة', reviews: 'تقييم' })[b.key] || b.key} × ${b.goal}</div></div><b>${b.users == null ? '—' : b.users}</b><span class="muted" style="font-size:12px">مستخدم</span></div>`).join('')}</div></div>
    <div class="card"><b>المستويات</b><div style="margin-top:10px;display:grid;gap:8px">${d.levels.map((l, i) => `<div><div class="row" style="font-size:13px"><b>${i + 1}. ${h(l.name)}</b><span class="muted">من ${l.at} نقطة</span><span class="grow"></span><b>${l.users}</b></div><div style="height:8px;background:var(--chip);border-radius:4px;margin-top:4px"><div style="height:100%;width:${(l.users / max) * 100}%;background:var(--lilac);border-radius:4px"></div></div></div>`).join('')}</div></div></div>
    <div class="card" style="margin-top:14px"><b>أعلى 25 مستخدم</b><div class="list" style="margin-top:10px">${d.top.map((u, i) => `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--chip)"><b style="width:26px">${i + 1}</b><div class="grow"><b>${h(u.name || 'بدون اسم')}</b> ${u.role === 'guide' ? '<span class="badge b-live">مرشد</span>' : u.role === 'admin' ? '<span class="badge b-panel">فريق الدليل</span>' : ''}<div class="muted" style="font-size:12px">${cityName(u.city)} · ${u.answers} إجابة · ${u.visits} زيارة</div></div><b style="color:var(--orangeDeep)">${u.points}</b></div>`).join('') || '<div class="muted">ما فيه مستخدمين</div>'}</div><p class="muted" style="font-size:13px">تقدر تعطي أحد «مرشد موثّق» من صفحة المستخدمين.</p></div>`;
}

/* ——— التحليلات ——— */
function spark(arr, color) {
  const W = 300, H = 70, mx = Math.max(1, ...arr), step = W / (arr.length - 1 || 1);
  const pts = arr.map((v, i) => `${(i * step).toFixed(1)},${(H - 4 - (v / mx) * (H - 12)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:70px;display:block" preserveAspectRatio="none"><polyline points="0,${H} ${pts} ${W},${H}" fill="${color}22" stroke="none"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
}
async function analyticsView() {
  const m = $('#main');
  m.innerHTML = '<p class="muted">لحظة...</p>';
  const d = await api('/admin/analytics');
  const c = d.counts, s = d.series, sum = (a) => a.reduce((x, y) => x + y, 0);
  const first = new Date(d.day0 * 86400e3), last = new Date((d.day0 + 29) * 86400e3);
  const dd = (x) => x.toLocaleDateString('ar-SA-u-ca-gregory-nu-latn', { day: 'numeric', month: 'short', timeZone: 'UTC' });
  const S = (n, l, col) => `<div class="stat"><div class="n" style="color:${col}">${n}</div><div class="l">${l}</div></div>`;
  const chart = (title, arr, col) => `<div class="card"><div class="row"><b class="grow">${title}</b><b style="color:${col}">${sum(arr)}</b></div>${spark(arr, col)}<div class="row muted" style="font-size:11px;direction:ltr"><span>${dd(first)}</span><span class="grow"></span><span>${dd(last)}</span></div></div>`;
  m.innerHTML = `<h1>التحليلات</h1><p class="sub">آخر 30 يوم بتوقيت مكة. «نشط» = فتح التطبيق وهو مسجّل دخول.</p>
    <div class="stats">${S(c.users, 'مستخدم مسجّل', 'var(--purple)')}${S(c.d1, 'نشط اليوم', 'var(--green)')}${S(c.d7, 'نشط هالأسبوع', 'var(--green)')}${S(c.d30, 'نشط هالشهر', 'var(--green)')}
    ${S(c.devices, 'جهاز للإشعارات', 'var(--skyDeep)')}${S(c.trips, 'سوّى رحلة', 'var(--orangeDeep)')}${S(c.visits, 'زيارة مؤكدة', 'var(--lilac)')}${S(c.reviews, 'تقييم', 'var(--orangeDeep)')}${S(c.merchants + ' / ' + c.coupons, 'تاجر / كوبون فعّال', 'var(--pinkDeep)')}${S(c.redeems, 'كوبون استُخدم', 'var(--pinkDeep)')}</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">${chart('تسجيلات جديدة', s.signups, '#604C87')}${chart('أسئلة ونصائح', s.posts, '#2E86B8')}${chart('إجابات', s.answers, '#8E65AB')}${chart('تقييمات', s.reviews, '#E07B22')}${chart('زيارات مؤكدة', s.visits, '#3E8E5A')}${chart('كوبونات مستخدمة', s.redeems, '#C9506F')}</div>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px" class="msgGrid">
    <div class="card"><b>المستخدمين حسب المدينة</b><div class="list" style="margin-top:8px">${d.cities.map((x) => `<div class="row" style="font-size:14px"><span class="grow">${cityName(x.city)}</span><b>${x.n}</b></div>`).join('') || '<div class="muted">ما اختاروا مدن للحين</div>'}</div></div>
    <div class="card"><b>أكثر الأماكن في «رحلتي»</b><div class="list" style="margin-top:8px">${d.places.map((x) => `<div class="row" style="font-size:14px"><span class="grow">${h(x.title)} <span class="muted" style="font-size:12px">${cityName(x.city)}</span></span><b>${x.trips}</b><span class="muted" style="font-size:12px">${x.visits} زيارة</span></div>`).join('') || '<div class="muted">ما فيه رحلات محفوظة للحين</div>'}</div></div></div>`;
}

render();
</script>
