<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة دليل السعودية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
.geo{position:relative}
.geo .map{height:280px;border-radius:16px;margin-top:8px;border:1.5px solid var(--line);z-index:1}
.sug{position:absolute;top:46px;right:0;left:0;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(43,39,69,.18);z-index:5;overflow:hidden;display:none}
.sug div{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--chip)}
.sug div:hover{background:var(--chip)}
.sug b{display:block;font-size:14px}.sug span{font-size:12px;color:var(--muted)}
:root{--ink:#2B2745;--muted:#6B6585;--faint:#9C94B5;--purple:#604C87;--lilac:#8E65AB;--orange:#F89743;--orangeDeep:#E07B22;--pink:#EB839B;--pinkDeep:#C9506F;--sky:#62B9E8;--skyDeep:#2E86B8;--green:#3E8E5A;--bg:#F4F1EE;--line:#E2DAEC;--chip:#F1ECF6;--white:#fff;--softPurple:#ECE5F3;--softOrange:#FDE7D3;--softPink:#FBE3EA;--softGreen:#E2F0E6;--softSky:#E2F1FA}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--purple)}
.app{display:flex;min-height:100vh}
aside{width:230px;background:var(--ink);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font-weight:700;font-size:17px}
.brand i{width:36px;height:36px;border-radius:11px;background:var(--orange);display:grid;place-items:center;font-style:normal}
.nav{display:flex;align-items:center;gap:10px;padding:8px 12px;flex-shrink:0;border-radius:12px;cursor:pointer;color:#CFC6DE;font-weight:600;border:0;background:none;text-align:right;width:100%}
.nav:hover{background:rgba(255,255,255,.07)}
.nav.on{background:var(--orange);color:#fff}
.nav b{margin-inline-start:auto;background:var(--pinkDeep);color:#fff;border-radius:999px;padding:0 8px;font-size:12px}
aside .foot{margin-top:auto;font-size:12px;color:#9C94B5;padding:8px}
main{flex:1;min-width:0;padding:26px 28px 80px}
h1{font-size:26px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat{background:#fff;border-radius:20px;padding:16px}
.stat .n{font-size:28px;font-weight:700}
.stat .l{color:var(--muted);font-size:13px}
.card{background:#fff;border-radius:20px;padding:16px}
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:700;cursor:pointer;background:var(--purple);color:#fff;white-space:nowrap}
.btn.o{background:var(--orange)}.btn.g{background:var(--green)}.btn.p{background:var(--pinkDeep)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.in,select.in,textarea.in{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;width:100%;outline:none}
.in:focus{border-color:var(--lilac)}
textarea.in{min-height:130px;resize:vertical;line-height:1.8}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters .in{width:auto;min-width:150px}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:10px;cursor:pointer;border:2px solid transparent}
.item:hover{border-color:var(--line)}
.item img,.item .ph{width:64px;height:64px;border-radius:14px;object-fit:cover;background:var(--chip);flex-shrink:0;display:grid;place-items:center;color:var(--faint);font-size:12px}
.item .t{font-weight:700}
.item .m{color:var(--muted);font-size:13px}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.b-live{background:var(--softGreen);color:var(--green)}.b-draft{background:var(--softOrange);color:var(--orangeDeep)}.b-hidden{background:var(--chip);color:var(--muted)}
.b-panel{background:var(--softPurple);color:var(--purple)}
.tabs{display:flex;gap:6px;background:#fff;border-radius:14px;padding:4px;width:fit-content;margin-bottom:14px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:10px;font-weight:700;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--purple);color:#fff}
.drawer{position:fixed;inset:0;background:rgba(43,39,69,.45);display:none;z-index:20}
.drawer.on{display:block}
.sheet{position:absolute;top:0;bottom:0;left:0;width:min(720px,100%);background:var(--bg);overflow:auto;padding:22px 24px 120px;box-shadow:0 0 40px rgba(0,0,0,.2)}
.sheet h2{margin:0;font-size:22px}
.f{display:grid;gap:6px;margin-top:14px}
.f label{font-weight:700;font-size:13px}
.f small{color:var(--muted);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:var(--purple);border-color:var(--purple);color:#fff}
.imgs{display:flex;gap:8px;flex-wrap:wrap}
.imgs .im{position:relative;width:110px;height:84px;border-radius:12px;overflow:hidden;background:var(--chip)}
.imgs .im img{width:100%;height:100%;object-fit:cover}
.imgs .im .x{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:rgba(0,0,0,.6);color:#fff;border:0;cursor:pointer}
.imgs .im .cover{position:absolute;bottom:4px;right:4px;background:var(--orange);color:#fff;font-size:11px;border-radius:999px;padding:0 8px;font-weight:700}
.imgs .im .mk{position:absolute;bottom:4px;right:4px;background:rgba(255,255,255,.85);border:0;border-radius:999px;font-size:11px;padding:0 8px;cursor:pointer}
.up{font:inherit;line-height:1.5;width:110px;height:84px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:13px;background:#fff}
.bar{position:sticky;bottom:-120px;margin:22px -24px -120px;padding:14px 24px 24px;background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:8px;flex-wrap:wrap}
.im[draggable=true]{cursor:grab}.im.dragging{opacity:.4}.im.over{outline:3px solid var(--orange)}
.warn{background:var(--softOrange);color:var(--orangeInk,#995306);border-radius:14px;padding:10px 14px;font-size:13px;margin-top:10px}
.warn a{color:inherit;font-weight:700}
.prev{background:#fff;border-radius:22px;overflow:hidden;max-width:340px;box-shadow:0 8px 30px rgba(43,39,69,.12);margin-top:10px}
.prev .cv{height:170px;background:var(--chip) center/cover;position:relative}
.prev .cv b{position:absolute;bottom:10px;right:10px;background:#fff;border-radius:999px;padding:2px 10px;font-size:12px}
.prev .bd{padding:14px}.prev h3{margin:0;font-size:19px}.prev p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.8}
.mini{border:0;border-radius:10px;padding:5px 12px;font-weight:700;cursor:pointer;font-size:13px}
.season{background:#fff;border-radius:20px;padding:16px;cursor:pointer;border-right:6px solid var(--purple)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:600;z-index:50;display:none}
.empty{color:var(--muted);text-align:center;padding:40px}
.login{max-width:380px;margin:12vh auto;background:#fff;border-radius:26px;padding:28px;text-align:center}
.login i{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:20px;background:var(--purple);color:#fff;font-style:normal;font-size:28px;margin-bottom:10px}
.post{background:#fff;border-radius:18px;padding:14px;display:grid;gap:8px}
.muted{color:var(--muted)}
.tag{font-size:12px;color:var(--skyDeep);font-weight:700}
.hint{background:var(--softPurple);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--purple)}
/* لوحة القيادة */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:18px;padding:14px 16px;cursor:default}.kpi[data-go]{cursor:pointer}.kpi .l{color:var(--muted);font-size:12.5px;font-weight:600}
.kpi .n{font-size:28px;font-weight:700;line-height:1.3}.kpi .s{font-size:11.5px;color:var(--faint)}
.dup{color:var(--green);font-weight:700}.ddown{color:var(--pinkDeep);font-weight:700}
.dgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.dgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.task{display:flex;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--chip);cursor:pointer;border-radius:8px}.task:hover{background:var(--chip)}.task b{min-width:30px;font-size:17px}
.li{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--chip);font-size:14px}.li[data-place],.li[data-ev]{cursor:pointer}
.rk{width:22px;height:22px;border-radius:7px;background:var(--chip);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--purple)}
.lg{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.ok{background:var(--softGreen);color:var(--green);border-radius:12px;padding:12px;font-weight:700;text-align:center}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.mini-stats div{background:var(--bg);border-radius:12px;padding:8px;text-align:center}.mini-stats b{display:block;font-size:18px}.mini-stats span{font-size:11.5px;color:var(--muted)}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.dgrid3{grid-template-columns:1fr 1fr}}
@media (max-width:820px){
  .kpis{grid-template-columns:1fr 1fr}.dgrid,.dgrid3{grid-template-columns:1fr}
  .msgGrid{grid-template-columns:1fr!important}
  .app{flex-direction:column}
  aside{width:auto;height:auto;position:sticky;top:0;z-index:10;flex-direction:row;overflow-x:auto;padding:10px;gap:4px}
  .brand,aside .foot{display:none}
  .nav{width:auto;white-space:nowrap;padding:8px 12px}
  main{padding:18px 16px 80px}
  .two{grid-template-columns:1fr}
  .sheet{padding:18px 16px 120px}
  .bar{margin:22px -16px -120px;padding:14px 16px 24px}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
const API = location.origin;
const KIND = { islamic: 'معالم إسلامية', heritage: 'تراث وثقافة', nature: 'طبيعة', sights: 'معالم سياحية', fun: 'ترفيه', food: 'مطاعم', cafe: 'مقاهي', shopping: 'تسوق' };
const ST = { live: ['منشور', 'b-live'], draft: ['مسودة', 'b-draft'], hidden: ['مخفي', 'b-hidden'] };
const EV_TYPES = ['حفلات غنائية', 'مسرح', 'رياضية', 'مهرجانات', 'معارض ومؤتمرات', 'تراث وثقافة', 'ترفيه', 'تجارب ومغامرات', 'عائلية', 'طعام'];
const SEASONS = ['موسم الرياض', 'موسم جدة', 'موسم الدرعية', 'لحظات العلا'];
let KEY = localStorage.getItem('sg_admin') || '';
let TOKEN = localStorage.getItem('sg_panel_token') || '';
let ME = null;
let META = null, VIEW = 'home', SUMMARY = null;
const $ = (s, el = document) => el.querySelector(s);
const h = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cityName = (id) => META?.cities.find((c) => c.id === id)?.name || id || '—';
function toast(t) { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => (el.style.display = 'none'), 2600); }

async function api(path, opt = {}) {
  const r = await fetch(API + path, { method: opt.method || 'GET', headers: { ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : { 'X-Admin-Key': KEY }), ...(opt.body && !(opt.body instanceof Blob) ? { 'Content-Type': 'application/json' } : {}), ...(opt.headers || {}) }, body: opt.body instanceof Blob ? opt.body : opt.body ? JSON.stringify(opt.body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && path.startsWith('/admin')) { const wasIn = !!(TOKEN || KEY); signOut(false); if (wasIn) render(); throw new Error('unauthorized'); }
  if (!r.ok) throw new Error(d.error || 'http_' + r.status);
  return d;
}
const ERR = { text_required: 'اكتب الرسالة', title_required: 'اكتب الاسم', start_required: 'حدد تاريخ البداية', bad_city: 'اختر المدينة', bad_type: 'الصورة لازم JPG أو PNG أو WEBP', bad_size: 'الصورة أكبر من 10MB', bad_time: 'الوقت لازم يكون بعد الحين', no_channel: 'اختر قناة وحدة على الأقل' };
const errMsg = (e) => ERR[e.message] || 'صار خطأ: ' + e.message;

/* ——— الدخول: بحساب دليل السعودية (قوقل أو آبل) — لازم يكون الحساب مشرف ——— */
function signOut(all) {
  const t = TOKEN;
  if (all && t) fetch(API + '/admin/session/logout-all', { method: 'POST', headers: { Authorization: 'Bearer ' + t } }).catch(() => {});
  TOKEN = ''; KEY = ''; ME = null; META = null; SUMMARY = null;
  localStorage.removeItem('sg_panel_token'); localStorage.removeItem('sg_admin');
}
const LOGIN_ERR = { not_admin: 'هذا الحساب مو مشرف. ادخل بالحساب اللي عليه صلاحية الإدارة.', no_account: 'ما فيه حساب في دليل السعودية بهذا الإيميل. سجّل في التطبيق أول، أو ادخل بحسابك الثاني.', bad_token: 'ما قدرنا نتحقق من الدخول، جرّب مرة ثانية.', too_many: 'محاولات كثيرة. انتظر ساعة وجرّب.' };
async function panelLogin(provider, idToken) {
  $('#msg').textContent = '';
  try {
    const r = await fetch(API + '/v1/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ provider, idToken }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { $('#msg').textContent = LOGIN_ERR[d.error] || 'ما نجح الدخول (' + (d.error || r.status) + ')'; return; }
    TOKEN = d.token; localStorage.setItem('sg_panel_token', TOKEN); localStorage.removeItem('sg_admin'); KEY = '';
    ME = d.user; render();
  } catch (e) { $('#msg').textContent = 'السيرفر ما رد: ' + e.message; }
}
const loadJs = (src) => new Promise((ok, no) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const el = document.createElement('script'); el.src = src; el.onload = ok; el.onerror = no; document.head.appendChild(el); });
async function loginView() {
  $('#root').innerHTML = `<div class="login"><i>د</i><h1 style="font-size:22px">لوحة دليل السعودية</h1>
    <p class="sub">ادخل بحسابك في دليل السعودية. اللوحة للحسابات المشرفة بس.</p>
    <div id="gbtn" style="display:flex;justify-content:center;min-height:44px"></div>
    <button class="btn" id="apple" style="width:100%;margin-top:10px;display:none;background:#000">دخول بآبل</button>
    <p id="msg" style="color:var(--pinkDeep);font-weight:700;margin-top:12px"></p>
    <details style="margin-top:22px;text-align:right"><summary class="muted" style="cursor:pointer;font-size:13px">دخول بمفتاح الإدارة (للطوارئ)</summary>
      <input class="in" id="k" type="password" placeholder="مفتاح الإدارة" autocomplete="off" style="margin-top:8px">
      <button class="btn" style="width:100%;margin-top:8px" id="go">دخول بالمفتاح</button></details></div>`;
  const go = async () => {
    KEY = (String($('#k').value).match(/[A-Za-z0-9_-]{8,}/) || [''])[0]; TOKEN = '';
    if (!KEY) { $('#msg').textContent = 'الصق المفتاح'; return; }
    try { await api('/admin/summary'); localStorage.setItem('sg_admin', KEY); render(); }
    catch (e) { KEY = ''; $('#msg').textContent = e.message === 'unauthorized' ? 'المفتاح غلط' : 'السيرفر ما رد: ' + e.message; }
  };
  $('#go').onclick = go; $('#k').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  let cfg = {};
  try { cfg = await fetch(API + '/v1/web/config').then((r) => r.json()); } catch { $('#msg').textContent = 'السيرفر ما رد، حدّث الصفحة'; return; }
  if (cfg.googleWebClientId) {
    try {
      await loadJs('https://accounts.google.com/gsi/client');
      google.accounts.id.initialize({ client_id: cfg.googleWebClientId, callback: (r) => panelLogin('google', r.credential), ux_mode: 'popup', auto_select: false });
      google.accounts.id.renderButton($('#gbtn'), { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', locale: 'ar', width: 300 });
    } catch { $('#gbtn').innerHTML = '<p class="muted">ما قدرنا نحمّل زر قوقل</p>'; }
  }
  if (cfg.appleServiceId) {
    $('#apple').style.display = 'block';
    $('#apple').onclick = async () => {
      try {
        await loadJs('https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/ar_SA/appleid.auth.js');
        AppleID.auth.init({ clientId: cfg.appleServiceId, scope: 'name email', redirectURI: location.origin, usePopup: true });
        const r = await AppleID.auth.signIn();
        panelLogin('apple', r.authorization.id_token);
      } catch (e) { if (e?.error !== 'popup_closed_by_user') $('#msg').textContent = 'ما نجح الدخول بآبل'; }
    };
  }
}

/* ——— الأمان: مين دخل اللوحة ومتى ——— */
async function securityView() {
  const m = $('#main');
  m.innerHTML = `<h1>الأمان والدخول</h1><p class="sub">${ME ? `داخل بحساب <b>${h(ME.name || ME.email)}</b>${ME.email ? ' (' + h(ME.email) + ')' : ''}. الجلسة تنتهي لحالها بعد 30 يوم.` : 'داخل بمفتاح الإدارة.'}</p>
    <div class="row" style="margin-bottom:14px"><button class="btn p" id="allout">اطلع من كل الأجهزة</button></div>
    <h2 style="font-size:17px">آخر محاولات الدخول</h2><div id="res" class="list"><p class="muted">لحظة...</p></div>`;
  $('#allout').onclick = () => { if (!confirm('بيطلع كل جهاز داخل اللوحة الحين (وأنت منهم). تكمل؟')) return; signOut(true); render(); };
  const R = { not_admin: 'الحساب مو مشرف', no_account: 'ما له حساب', too_many: 'محاولات كثيرة' };
  const d = await api('/admin/session/logins');
  $('#res').innerHTML = d.logins.map((l) => `<div class="post"><div class="row"><b class="grow">${h(l.name || l.email || 'غير معروف')}</b><span class="badge ${l.ok ? 'b-live' : 'b-draft'}">${l.ok ? 'دخل' : 'مرفوض'}</span></div>
    <div class="muted" style="font-size:13px">${new Date(l.at * 1000).toLocaleString('ar-SA-u-ca-gregory-nu-latn', { timeZone: 'Asia/Riyadh', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })} · ${l.provider === 'apple' ? 'آبل' : 'قوقل'}${l.email ? ' · ' + h(l.email) : ''}${l.reason ? ' · ' + h(R[l.reason] || l.reason) : ''}</div>
    <div class="muted" style="font-size:12px" dir="ltr">${h(l.ip || '')} · ${h((l.ua || '').slice(0, 90))}</div></div>`).join('') || '<div class="empty">ما فيه دخول مسجّل للحين</div>';
}

/* ——— الهيكل ——— */

function chart2(a, b, W = 600, H = 150) {
  const mx = Math.max(1, ...a, ...b), step = W / (a.length - 1 || 1);
  const pts = (arr) => arr.map((v, i) => `${(i * step).toFixed(1)},${(H - 6 - (v / mx) * (H - 20)).toFixed(1)}`).join(' ');
  const grid = [0.25, 0.5, 0.75].map((f) => `<line x1="0" x2="${W}" y1="${(H - 6 - f * (H - 20)).toFixed(1)}" y2="${(H - 6 - f * (H - 20)).toFixed(1)}" stroke="#EEE9F2" stroke-width="1"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;direction:ltr" preserveAspectRatio="none">${grid}
    <polyline points="0,${H} ${pts(a)} ${W},${H}" fill="#604C8718" stroke="none"/><polyline points="${pts(a)}" fill="none" stroke="#604C87" stroke-width="2.5" stroke-linejoin="round"/>
    <polyline points="${pts(b)}" fill="none" stroke="#F89743" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/></svg>`;
}

function imagesWidget(el, list, onChange) {
  const draw = () => {
    el.innerHTML = `<div class="imgs">${list.map((u, i) => `<div class="im" draggable="true" data-i="${i}" title="اسحبها لترتيب الصور"><img src="${h(u)}" draggable="false">${i === 0 ? '<span class="cover">الغلاف</span>' : `<button class="mk" data-i="${i}">اجعلها الغلاف</button>`}<button class="x" data-i="${i}" title="شيل">×</button></div>`).join('')}

      <input class="in" style="margin-top:8px" placeholder="أو الصق رابط صورة واضغط Enter">`;
    el.querySelectorAll('.x').forEach((b) => (b.onclick = () => { list.splice(+b.dataset.i, 1); draw(); }));
    let from = -1;
    el.querySelectorAll('.im').forEach((im) => {
      im.ondragstart = (e) => { from = +im.dataset.i; im.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'img'); };
      im.ondragend = () => im.classList.remove('dragging');
      im.ondragover = (e) => { if (from < 0) return; e.preventDefault(); e.stopPropagation(); im.classList.add('over'); };
      im.ondragleave = () => im.classList.remove('over');
      im.ondrop = (e) => { if (from < 0) return; e.preventDefault(); e.stopPropagation(); const to = +im.dataset.i; const [u] = list.splice(from, 1); list.splice(to, 0, u); from = -1; draw(); onChange && onChange(); };

    const fi = el.querySelector('input[type=file]');
    el.querySelector('#upBtn').onclick = () => fi.click();
    const upload = async (files) => {
      for (const f of files) {
        if (!/^image\/(jpeg|png|webp)$/.test(f.type)) { toast('الصورة لازم JPG أو PNG أو WEBP (صور الآيفون HEIC حوّلها أول)'); continue; }
        toast('يرفع الصورة...');
        try { const r = await api('/admin/upload', { method: 'POST', body: f, headers: { 'Content-Type': f.type } }); list.push(r.url); draw(); onChange && onChange(); toast('انرفعت'); } catch (er) { toast(errMsg(er)); }
      }
    };
    fi.onchange = (e) => upload([...e.target.files]);
    const zone = el.querySelector('.imgs');
    zone.ondragover = (e) => { e.preventDefault(); zone.style.outline = '2px dashed var(--orange)'; };
    zone.ondragleave = () => (zone.style.outline = '');

    el.querySelector('input.in').onkeydown = (e) => { if (e.key === 'Enter' && /^https?:\/\//.test(e.target.value)) { e.preventDefault(); list.push(e.target.value.trim()); draw(); } };

}

  imagesWidget($('#imgs', d), images);
  $('#x', d).onclick = closeDrawer;

      toast(status === 'live' ? 'انحفظ وانتشر' : 'انحفظ'); closeDrawer(); VIEW === 'articles' ? articlesView() : render();

}

/* ——— التحليلات ——— */
function spark(arr, color) {
  const W = 300, H = 70, mx = Math.max(1, ...arr), step = W / (arr.length - 1 || 1);
  const pts = arr.map((v, i) => `${(i * step).toFixed(1)},${(H - 4 - (v / mx) * (H - 12)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:70px;display:block" preserveAspectRatio="none"><polyline points="0,${H} ${pts} ${W},${H}" fill="${color}22" stroke="none"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
}
async function analyticsView() {
  const m = $('#main');
  m.innerHTML = '<p class="muted">لحظة...</p>';
  const d = await api('/admin/analytics');
  const c = d.counts, s = d.series, sum = (a) => a.reduce((x, y) => x + y, 0);
  const first = new Date(d.day0 * 86400e3), last = new Date((d.day0 + 29) * 86400e3);
  const dd = (x) => x.toLocaleDateString('ar-SA-u-ca-gregory-nu-latn', { day: 'numeric', month: 'short', timeZone: 'UTC' });
  const S = (n, l, col) => `<div class="stat"><div class="n" style="color:${col}">${n}</div><div class="l">${l}</div></div>`;
  const chart = (title, arr, col) => `<div class="card"><div class="row"><b class="grow">${title}</b><b style="color:${col}">${sum(arr)}</b></div>${spark(arr, col)}<div class="row muted" style="font-size:11px;direction:ltr"><span>${dd(first)}</span><span class="grow"></span><span>${dd(last)}</span></div></div>`;
  m.innerHTML = `<h1>التحليلات</h1><p class="sub">آخر 30 يوم بتوقيت مكة. «نشط» = فتح التطبيق وهو مسجّل دخول.</p>
    <div class="stats">${S(c.users, 'مستخدم مسجّل', 'var(--purple)')}${S(c.d1, 'نشط اليوم', 'var(--green)')}${S(c.d7, 'نشط هالأسبوع', 'var(--green)')}${S(c.d30, 'نشط هالشهر', 'var(--green)')}
    ${S(c.devices, 'جهاز للإشعارات', 'var(--skyDeep)')}${S(c.trips, 'سوّى رحلة', 'var(--orangeDeep)')}${S(c.visits, 'زيارة مؤكدة', 'var(--lilac)')}${S(c.reviews, 'تقييم', 'var(--orangeDeep)')}${S(c.merchants + ' / ' + c.coupons, 'تاجر / كوبون فعّال', 'var(--pinkDeep)')}${S(c.redeems, 'كوبون استُخدم', 'var(--pinkDeep)')}</div>

    <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px" class="msgGrid">

      ${x.ai && (x.ai.summary || x.ai.reason) ? `<div style="font-size:13.5px;background:var(--softPurple);border-radius:12px;padding:10px 12px"><b>المراجعة الذكية:</b> ${({ approve: 'يبدو مكان حقيقي', review: 'تحتاج نظرك', reject: 'رفضته' })[x.ai.decision] || ''}${x.ai.reason ? ' · ' + h(x.ai.reason) : ''}${x.ai.summary ? `<div style="margin-top:4px"><b>الملخص المقترح:</b> ${h(x.ai.summary)}</div>` : ''}${x.ai.body ? `<div class="muted" style="margin-top:2px">${h(x.ai.body)}</div>` : ''}</div>` : ''}
      ${pl ? `<div><a href="#" data-open="${pl.id}">افتح المكان في اللوحة</a></div>` : ''}
      ${STAB === 'pending' ? `<div class="row"><button class="btn g" data-ok="${x.id}">${x.type === 'new' ? 'اقبل وأضفه مسودة' : x.type === 'closed' ? 'اقبل وأخفِ المكان' : 'اقبل وطبّق المحدد'}</button><button class="btn p" data-no="${x.id}">رفض</button></div>` : ''}</div>`;
  }).join('') || `<div class="empty">${STAB === 'pending' ? 'ما فيه اقتراحات تنتظر' : 'ما فيه شي هنا'}</div>`;
  m.querySelectorAll('[data-open]').forEach((a) => (a.onclick = async (e) => { e.preventDefault(); const r = await api('/admin/places/' + a.dataset.open); editPlace(r.place); }));
  m.querySelectorAll('[data-ok]').forEach((b) => (b.onclick = async () => {
    const id = b.dataset.ok;
    const apply = [...m.querySelectorAll(`[data-ap="${id}"]:checked`)].map((c) => c.value);
    try {
      const r = await api('/admin/suggestions/' + id, { method: 'POST', body: { status: 'approved', apply } });
      toast('انقبل ووصله إشعار'); SUMMARY = null;
      if (r.placeId && b.textContent.includes('مسودة') && confirm('انضاف كمسودة. تفتحه الحين وتكمّل صوره؟')) { const pr = await api('/admin/places/' + r.placeId); editPlace(pr.place); }
      suggestView();
    } catch (e) { toast(errMsg(e)); }
  }));
  m.querySelectorAll('[data-no]').forEach((b) => (b.onclick = async () => { const note = prompt('سبب الرفض (يوصله)؟'); if (note === null) return; await api('/admin/suggestions/' + b.dataset.no, { method: 'POST', body: { status: 'rejected', note } }); toast('انرفض'); SUMMARY = null; suggestView(); }));
}

/* ——— المميزات: إظهار وإخفاء ——— */
async function featuresView() {
  const m = $('#main');
  const d = await api('/admin/features');
  m.innerHTML = `<h1>المميزات</h1><p class="sub">أي ميزة تطفيها هنا تختفي من التطبيق خلال دقيقة، بدون تحديث. البيانات تبقى محفوظة، وترجع لما تشغلها.</p>
    <div class="card" style="max-width:640px">${Object.entries(d.labels).map(([k, l]) => `<label class="row" style="padding:12px 4px;border-bottom:1px solid var(--chip);cursor:pointer"><span class="grow" style="font-weight:600">${h(l)}</span><span class="badge ${d.features[k] ? 'b-live' : 'b-hidden'}" id="fb-${k}">${d.features[k] ? 'ظاهرة' : 'مخفية'}</span><input type="checkbox" data-f="${k}" ${d.features[k] ? 'checked' : ''} style="width:22px;height:22px"></label>`).join('')}</div>`;
  m.querySelectorAll('[data-f]').forEach((c) => (c.onchange = async () => {
    const r = await api('/admin/features', { method: 'POST', body: { [c.dataset.f]: c.checked } });
    const on = r.features[c.dataset.f]; const b = $('#fb-' + c.dataset.f); b.textContent = on ? 'ظاهرة' : 'مخفية'; b.className = 'badge ' + (on ? 'b-live' : 'b-hidden');
    toast(on ? 'رجعت للتطبيق' : 'انخفت من التطبيق');
  }));
}

/* ——— رسائل التواصل (من داخل التطبيق) ——— */
let CT = { status: 'new', kind: '' };
async function contactView() {
  const m = $('#main');
  const d = await api('/admin/contact?status=' + CT.status + (CT.kind ? '&kind=' + CT.kind : ''));
  const K = d.kinds;
  m.innerHTML = `<h1>رسائل التواصل</h1><p class="sub">كل رسائل «تواصل معنا» من التطبيق. ردّك يوصل المستخدم إشعار داخل التطبيق.</p>
    <div class="tabs">${[['new', 'جديدة'], ['done', 'تم الرد / انتهت'], ['archived', 'مؤرشفة'], ['all', 'الكل']].map(([k, t]) => `<button data-s="${k}" class="${CT.status === k ? 'on' : ''}">${t}</button>`).join('')}</div>
    <div class="chips" style="margin:10px 0">${[['', 'كل الأنواع'], ...Object.entries(K)].map(([k, t]) => { const n = k ? (d.counts[k]?.new || 0) : Object.values(d.counts).reduce((a, x) => a + (x.new || 0), 0); return `<span class="chip ${CT.kind === k ? 'on' : ''}" data-k="${k}">${h(t)}${n ? ` <b style="color:var(--orangeDeep)">${n}</b>` : ''}</span>`; }).join('')}</div>
    <div class="list">${d.items.map((x) => `<div class="card" style="margin:0">
      <div class="row"><span class="badge b-panel">${h(x.kindName)}</span><b class="grow">${x.user ? h(x.user.name) + (x.user.city ? ' · ' + h(cityName(x.user.city)) : '') : 'زائر بدون حساب'}</b><span class="muted" style="font-size:12px">${dAr(x.created)}${x.app ? ' · ' + h(x.app) : ''}</span></div>
      <div style="white-space:pre-wrap;margin:10px 0;line-height:1.9">${h(x.text)}</div>
      ${x.replyTo ? `<div class="muted" style="font-size:13px">للرد عليه: <b dir="ltr">${h(x.replyTo)}</b></div>` : ''}
      ${x.reply ? `<div style="background:var(--softGreen);border-radius:12px;padding:8px 12px;margin-top:8px;font-size:14px"><b>ردّك:</b> ${h(x.reply)}</div>` : ''}
      <div class="row" style="margin-top:10px;flex-wrap:wrap">
        ${x.user ? `<input class="in grow" data-r="${x.id}" placeholder="اكتب ردّك (يوصله إشعار)" style="min-width:220px">` : ''}
        ${x.user ? `<button class="btn o" data-send="${x.id}">أرسل الرد</button>` : ''}
        ${x.status !== 'done' ? `<button class="btn ghost" data-st="done" data-id="${x.id}">تم</button>` : ''}
        ${x.status !== 'archived' ? `<button class="btn ghost" data-st="archived" data-id="${x.id}">أرشفة</button>` : `<button class="btn ghost" data-st="new" data-id="${x.id}">رجّعها جديدة</button>`}
      </div></div>`).join('') || '<div class="empty">ما فيه رسائل هنا</div>'}</div>`;
  m.querySelectorAll('[data-s]').forEach((b) => (b.onclick = () => { CT.status = b.dataset.s; contactView(); }));
  m.querySelectorAll('[data-k]').forEach((b) => (b.onclick = () => { CT.kind = b.dataset.k; contactView(); }));
  m.querySelectorAll('[data-st]').forEach((b) => (b.onclick = async () => { await api('/admin/contact/' + b.dataset.id, { method: 'POST', body: { status: b.dataset.st } }); SUMMARY = null; toast('تم'); contactView(); }));
  m.querySelectorAll('[data-send]').forEach((b) => (b.onclick = async () => {
    const t = m.querySelector(`[data-r="${b.dataset.send}"]`).value.trim(); if (!t) return toast('اكتب الرد');
    await api('/admin/contact/' + b.dataset.send, { method: 'POST', body: { reply: t } }); SUMMARY = null; toast('وصله الرد'); contactView();
  }));
}

/* ——— الذكاء الاصطناعي ودليل+ ——— */
async function aiView() {
  const m = $('#main');
  const d = await api('/admin/ai');
  const K = { chat: 'اسأل الدليل', plan: 'خطط لي رحلتي' };
  const st = Object.fromEntries((d.stats || []).map((x) => [x.kind, x]));
  m.innerHTML = `<h1>الذكاء ودليل+</h1><p class="sub">المساعد الذكي «اسأل الدليل» ومخطط الرحلات. يجاوبون من محتوى الدليل فقط. المجاني له حد يومي، ومشترك دليل+ بدون حد.</p>
    ${d.configured ? '' : '<div class="card" style="border:2px solid var(--orangeDeep)"><b>مفتاح Claude مو مضاف للسيرفر</b><div class="muted">شغّل «اضف-مفتاح-Claude.command» من مجلد backend.</div></div>'}
    <div class="grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">
      ${['chat', 'plan'].map((k) => { const x = st[k] || {}; return `<div class="card"><b>${K[k]}</b><div style="font-size:28px;font-weight:800;color:var(--purple)">${x.n || 0}</div><div class="muted" style="font-size:13px">طلب آخر 30 يوم · ${x.users || 0} مستخدم · نجح ${x.ok || 0} · متوسط ${Math.round((x.ms || 0) / 100) / 10} ث</div></div>`; }).join('')}
      <div class="card"><b>مشتركين دليل+</b><div style="font-size:28px;font-weight:800;color:var(--orangeDeep)">${d.plusUsers}</div><div class="muted" style="font-size:13px">تقدر تهدي دليل+ من صفحة المستخدمين</div></div>
    </div>
    <div class="card" style="max-width:640px"><b>الحد المجاني اليومي</b>
      <div class="row" style="margin-top:10px"><span class="grow">أسئلة «اسأل الدليل» المجانية باليوم</span><input class="in" id="lc" type="number" min="0" max="100" value="${d.limits.chat}" style="width:90px"></div>
      <div class="row" style="margin-top:8px"><span class="grow">خطط ذكية مجانية بالشهر</span><input class="in" id="lp" type="number" min="0" max="20" value="${d.limits.plan}" style="width:90px"></div>
      <div class="muted" style="font-size:13px;margin:8px 0">0 يعني الميزة لمشتركين دليل+ فقط. الأسئلة تتجدد كل يوم، والخطط تتجدد أول كل شهر. ولإخفائها كلياً روح «المميزات».</div>
      <button class="btn o" id="ls">احفظ</button></div>
    <div class="card"><b>آخر الطلبات</b><div class="list">${(d.recent || []).map((r) => `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--chip)"><span class="badge ${r.ok ? 'b-live' : 'b-hidden'}">${K[r.kind] || r.kind}</span><span class="grow">${h(r.q || '')}</span><span class="muted" style="font-size:12px">${h(r.name || '')} · ${dAr(r.created)}</span></div>`).join('') || '<div class="muted">ما فيه طلبات للحين</div>'}</div></div>`;
  $('#ls').onclick = async () => { await api('/admin/ai/limits', { method: 'POST', body: { chat: +$('#lc').value, plan: +$('#lp').value } }); toast('انحفظ الحد'); };
}

/* ——— أبطال الشهر (داخل صفحة الأوسمة) ——— */
async function heroesBlock(el) {
  const city = el.dataset.city || '';
  const d = await api('/admin/heroes' + (city ? '?city=' + city : ''));
  el.innerHTML = `<div class="row"><b class="grow">أبطال ${h(d.month)}</b><select class="in" style="width:auto" id="hc"><option value="">كل المدن</option>${META.cities.map((c) => `<option value="${c.id}" ${c.id === city ? 'selected' : ''}>${h(c.name)}</option>`).join('')}</select></div>
    <p class="muted" style="font-size:13px;margin:6px 0">الترتيب من مساهمات الشهر: إجابة 5، أفضل إجابة 15، سؤال 2، تقييم 3، زيارة 10، صورة 5، سؤال سريع 1. يطلعون في المجتمع تلقائياً.</p>
    <div class="list">${d.heroes.map((x, i) => `<label class="row" style="padding:6px 0;border-bottom:1px solid var(--chip)"><input type="checkbox" data-hero="${h(x.id)}" ${i < 3 ? 'checked' : ''}><b style="width:22px">${i + 1}</b><span class="grow"><b>${h(x.name)}</b> ${x.guide ? '<span class="badge b-live">خبير محلي</span>' : ''}<span class="muted" style="font-size:12px"> · ${x.answers} إجابة · ${x.reviews} تقييم · ${x.visits} زيارة</span></span><b style="color:var(--orangeDeep)">${x.score}</b></label>`).join('') || '<div class="muted">ما فيه مساهمات هالشهر للحين</div>'}</div>
    ${d.heroes.length ? `<div class="row" style="margin-top:10px"><input class="in" id="hb" type="number" value="50" min="0" max="500" style="width:110px"><span class="muted">نقطة هدية</span><button class="btn o" id="honor">كرّم المحددين</button></div>` : ''}`;
  $('#hc', el).onchange = (e) => { el.dataset.city = e.target.value; heroesBlock(el); };
  $('#honor', el) && ($('#honor', el).onclick = async () => {
    const ids = [...el.querySelectorAll('[data-hero]:checked')].map((c) => c.dataset.hero);
    if (!ids.length) return toast('حدد أحد');
    if (!confirm(`ترسل تكريم لـ ${ids.length} وتضيف لهم ${$('#hb', el).value} نقطة؟`)) return;
    await api('/admin/heroes/honor', { method: 'POST', body: { userIds: ids, bonus: +$('#hb', el).value } }); toast('وصلهم التكريم');
  });
}

render();
</script>
</body>
</html>
