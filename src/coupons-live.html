<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>العروض والكوبونات - دليل السعودية</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F4F8;--ink:#373D63;--mut:#5A5F80;--line:rgba(55,61,99,.12);--p:#604C87;--or:#F89743;--acc:#B5551A;--grn:#16714A;--red:#B3354F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif}
html.lock,html.lock body{overflow:hidden}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
[hidden]{display:none!important}
.wrap{position:relative;max-width:640px;margin:0 auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 110px);overflow:hidden}
/* الهيدر: نفس ترويسة «اسأل أهل المدينة» */
.hdr{position:relative;overflow:hidden;padding:22px 16px 46px;border-radius:0 0 30px 30px;background:#604C87;color:#fff}
.hpat{position:absolute;left:-50px;top:4%;height:74%;width:auto;aspect-ratio:860/624;z-index:0;pointer-events:none}
.hfade{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to left,#604C87 40%,rgba(96,76,135,0) 62%)}
.hdr>:not(.hpat):not(.hfade){position:relative;z-index:2}
.hdr small{display:block;font-size:13px;color:#F8C08A;font-weight:700}
.hdr h1{margin:4px 0 4px;font:700 29px/1.3 'Readex Pro','IBM Plex Sans Arabic',sans-serif;max-width:66%}
.hdr p{margin:0 0 14px;font-size:14px;color:#DCD3EA;max-width:62%;line-height:1.6}
.addbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:14px;border:0;background:#fff;color:var(--p);font-weight:700;font-size:14px}
.addbtn svg{width:18px;height:18px}
/* البحث والفلاتر */
.sbox{margin:-26px 16px 0;position:relative;z-index:3}
.search{display:flex;align-items:center;gap:10px;height:54px;padding:0 16px;background:#fff;border-radius:16px;box-shadow:0 10px 24px -14px rgba(28,14,60,.45)}
.search svg{width:20px;height:20px;color:var(--p);flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:15px;color:var(--ink);background:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;color:var(--ink)}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.sh{display:flex;align-items:center;justify-content:space-between;padding:22px 16px 10px}
.sh h3{margin:0;font:700 18px/1.3 'Readex Pro','IBM Plex Sans Arabic',sans-serif;display:flex;align-items:center;gap:8px}
.sh h3 i{width:9px;height:9px;border-radius:3px;transform:rotate(45deg);display:inline-block}
.sh span{font-size:13px;color:var(--mut)}
/* المميز */
.feat{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}.feat::-webkit-scrollbar{display:none}
.fc{flex:0 0 78%;scroll-snap-align:start;border-radius:22px;padding:16px;color:#fff;position:relative;overflow:hidden;min-height:150px;border:0;text-align:start;font:inherit}
.fc b{display:block;font:700 32px/1 'Readex Pro',sans-serif;margin-bottom:12px}.fc b small{font-size:16px}
.fc h4{margin:0 0 4px;font-size:17px}.fc p{margin:0;font-size:13px;opacity:.92;line-height:1.5}
.fc .tag{position:absolute;top:14px;left:14px;background:rgba(255,255,255,.92);color:var(--ink);font-size:12px;font-weight:700;border-radius:10px;padding:4px 9px}
/* التذاكر */
.list{display:grid;gap:12px;padding:0 16px}
.tk{display:flex;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 6px 18px -12px rgba(55,61,99,.35);min-width:0}
.stub{flex:0 0 96px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;position:relative;padding:10px 6px;text-align:center}
.stub b{font:700 26px/1 'Readex Pro',sans-serif}.stub b small{font-size:13px}.stub span{font-size:12px;margin-top:4px;opacity:.95}
.stub:after{content:"";position:absolute;inset-block:10px;left:-1px;border-left:2px dashed rgba(255,255,255,.55)}
.tb{flex:1;min-width:0;padding:12px 14px 14px}
.trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tb h4{margin:0;font-size:16px;line-height:1.35}
.bdg{font-size:11px;font-weight:700;border-radius:8px;padding:2px 7px}.b-off{background:#E3F2EA;color:var(--grn)}.b-usr{background:#EFEBF5;color:var(--mut)}
.sub{font-size:12.5px;color:var(--mut);margin-top:2px}
.desc{margin:8px 0;font-size:14px;line-height:1.55}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.fact{font-size:12px;font-weight:600;background:#F3F0F8;color:var(--mut);border-radius:8px;padding:3px 8px}
.fact.warn{background:#FFF1E0;color:var(--acc)}
.src{display:inline-block;font-size:12px;color:var(--p);text-decoration:underline;margin-bottom:10px}
.acts{display:flex;gap:8px;align-items:center}
.reveal{flex:1;height:46px;border-radius:14px;border:0;background:var(--or);color:#2E1A07;font-weight:700;font-size:15px}
.codebox{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;height:46px;border-radius:14px;border:2px dashed var(--or);padding:0 6px 0 12px;background:#FFF8F0}
.codebox code{font:700 17px/1 ui-monospace,Menlo,monospace;letter-spacing:1px;direction:ltr;color:var(--ink)}
.codebox button{height:34px;border-radius:10px;border:0;background:var(--p);color:#fff;font-weight:700;font-size:13px;padding:0 12px}
.ib{flex:none;width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.ib svg{width:20px;height:20px}.ib.on{background:var(--p);border-color:var(--p);color:#fff}
.vote{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--mut);flex-wrap:wrap}
.vote button{height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;padding:0 10px}
.vote button.yes.on{background:#E3F2EA;border-color:#E3F2EA;color:var(--grn)}.vote button.no.on{background:#FBE7EC;border-color:#FBE7EC;color:var(--red)}
.own{margin-inline-start:auto;border:0!important;background:none!important;color:var(--mut);text-decoration:underline;padding:0 2px!important}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.empty button{margin-top:14px}
.wallet{margin:0 16px;background:#fff;border-radius:20px;padding:14px;display:flex;align-items:center;gap:12px;border:0;width:calc(100% - 32px);text-align:start;font:inherit}
.wallet .wi{width:46px;height:46px;border-radius:14px;background:#EEE6F8;color:var(--p);display:grid;place-items:center;flex:none}.wallet .wi svg{width:22px;height:22px}
.wallet b{display:block;font-size:15px}.wallet span{font-size:12.5px;color:var(--mut)}
/* الشيت */
.ov{position:fixed;inset:0;background:rgba(28,18,52,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
.sheet h3{margin:0 0 4px;font:700 19px/1.3 'Readex Pro','IBM Plex Sans Arabic',sans-serif}
.sheet .hint{margin:0 0 14px;font-size:13px;color:var(--mut);line-height:1.6}
.rules{background:#FFF6EC;border-radius:14px;padding:10px 12px;font-size:12.5px;line-height:1.7;color:#6B3B0E;margin-bottom:14px}
.rules b{display:block;margin-bottom:2px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg .full{grid-column:1/-1}
.fg label{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--mut)}
.fg input,.fg select,.fg textarea{font:inherit;font-size:15px;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#FBFAFD;width:100%}
.fg textarea{min-height:80px;resize:vertical}
.fg .ltr{direction:ltr;text-align:left}
.sbtn{width:100%;height:50px;border-radius:14px;border:0;background:var(--p);color:#fff;font-weight:700;font-size:16px;margin-top:14px}
.sbtn:disabled{opacity:.6}
.xbtn{width:100%;height:44px;border:0;background:none;color:var(--mut);font-weight:600;margin-top:4px}
.toast{position:fixed;inset-inline:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);margin:auto;max-width:420px;background:var(--ink);color:#fff;padding:11px 14px;border-radius:14px;text-align:center;font-size:14px;z-index:30;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  if(c.worked>0)facts+='<span class="fact">اشتغل مع '+c.worked+'</span>';
  var act=SHOWN[c.id]||!c.code?(c.code?'<div class="codebox"><code>'+esc(c.code)+'</code><button type="button" data-copy="'+c.id+'">نسخ</button></div>':'<div class="codebox"><span style="font-size:14px;font-weight:600">بدون كود، اذكر العرض عند الطلب</span></div>'):'<button type="button" class="reveal" data-reveal="'+c.id+'">اكشف الكود</button>';
  var vote=(SHOWN[c.id]||!c.code)?'<div class="vote">'+(v?'<span>شكراً، سجّلنا تجربتك</span>':'<span>جرّبته؟</span><button type="button" class="yes" data-vote="1" data-id="'+c.id+'">اشتغل ✓</button><button type="button" class="no" data-vote="0" data-id="'+c.id+'">ما اشتغل ✗</button>')+'<button type="button" class="own" data-own="'+c.id+'">أنا صاحب المتجر</button></div>':'';
  return '<article class="tk" id="c-'+c.id+'"><div class="stub" style="background:'+grad(c)+'"><b>'+val(c)+'</b><span>'+lbl(c)+'</span></div><div class="tb">'+
   '<div class="trow"><h4>'+esc(c.store_name)+'</h4><span class="bdg '+(c.kind==='official'?'b-off">رسمي ✓':'b-usr">شاركه مستخدم')+'</span></div>'+
   '<div class="sub">'+esc(catName(c.category))+' · '+esc(c.city)+(c.kind==='user'&&c.author_name?' · بواسطة '+esc(c.author_name):'')+'</div>'+
   '<p class="desc">'+esc(c.title)+'</p>'+(facts?'<div class="facts">'+facts+'</div>':'')+
   (c.kind==='user'&&c.source_url?'<a class="src" href="'+esc(c.source_url)+'" target="_blank" rel="noopener noreferrer">مصدر الكوبون</a>':'')+
   '<div class="acts">'+act+'<button type="button" class="ib'+(saved?' on':'')+'" data-save="'+c.id+'" aria-label="'+(saved?'إزالة من المحفظة':'حفظ في المحفظة')+'">'+(saved?IC.bmf:IC.bm)+'</button></div>'+vote+'</div></article>';}
function renderList(){var r=filtered();$('count').textContent=r.length?r.length+' عرض':'';
  $('listTitle').innerHTML='<i style="background:#EB839B"></i>'+(st.wallet?'كوبوناتي المحفوظة':'كل العروض');
  if(!r.length){$('list').innerHTML=ALL.length?'<div class="empty"><b>ما لقينا عروض بهذا الاختيار</b>جرّب تصنيف أو مدينة ثانية.</div>':'<div class="empty"><b>ما فيه عروض منشورة حالياً</b>عندك كوبون لمطعم أو متجر؟ شاركه مع الناس.<br><button type="button" class="addbtn" data-add="1" style="background:var(--p);color:#fff">شارك كوبون</button></div>';return;}
  $('list').innerHTML=r.map(card).join('');}
function renderAll(){renderChips();renderFeat();renderWallet();renderList();}

/* التفاعل */
var qT;$('q').addEventListener('input',function(){clearTimeout(qT);var v=this.value;qT=setTimeout(function(){st.q=v;renderList();},150);});
$('walletBtn').addEventListener('click',function(){st.wallet=!st.wallet;renderWallet();renderList();});
$('addBtn').addEventListener('click',openAdd);
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var id;
  if(b.dataset.cat){st.cat=b.dataset.cat;renderChips();renderList();return;}
  if(b.hasAttribute('data-city')){st.city=b.dataset.city;renderChips();renderList();return;}
  if(b.dataset.add){openAdd();return;}
  if(b.dataset.jump){var el=$('c-'+b.dataset.jump);st.cat='all';st.city='';st.wallet=false;st.q='';$('q').value='';renderAll();el=$('c-'+b.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});return;}
  if((id=b.dataset.reveal)){SHOWN[id]=1;rerender(id);var c=find(id);if(c&&c.code)copy(c);return;}
  if((id=b.dataset.copy)){copy(find(id));return;}
  if((id=b.dataset.save)){var i=SAVED.indexOf(id);if(i>=0)SAVED.splice(i,1);else SAVED.push(id);LS.set('sg_cpn2',SAVED);toast(i>=0?'انشال من المحفظة':'انحفظ في محفظتك');rerender(id);renderWallet();if(st.wallet)renderList();return;}
  if(b.dataset.vote!=null&&b.dataset.id){vote(b.dataset.id,b.dataset.vote==='1');return;}
  if((id=b.dataset.own)){openOwner(id);return;}
});
function find(id){return ALL.filter(function(c){return c.id===id;})[0];}
function rerender(id){var el=$('c-'+id),c=find(id);if(el&&c){var t=document.createElement('div');t.innerHTML=card(c);el.replaceWith(t.firstChild);}}
var COPIED={};
function copy(c){if(!c||!c.code)return;var done=function(){toast('انسخ الكود: '+c.code);};
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(c.code).then(done,function(){fallbackCopy(c.code);done();});}else{fallbackCopy(c.code);done();}}catch(e){done();}
  if(!COPIED[c.id]){COPIED[c.id]=1;sb('rpc/coupon_copied',{method:'POST',body:{cid:c.id}}).catch(function(){});}}
function fallbackCopy(t){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');}catch(e){}a.remove();}
function vote(id,ok){if(VOTED[id])return;VOTED[id]=ok?1:-1;LS.set('sg_cpn_votes',VOTED);rerender(id);
  sb('coupon_votes',{method:'POST',body:{coupon_id:id,device_id:DEV,gb_user_id:GBU?GBU.id:null,worked:ok},prefer:'return=minimal'}).then(function(){toast(ok?'حلو! بنقول للناس إنه شغال':'شكراً، لو تكرر البلاغ بنخفيه تلقائياً');}).catch(function(e){if(e.status===409)toast('سجّلنا تجربتك من قبل');});}

/* الشيت */
function openSheet(html){closeSheet();var ov=document.createElement('div');ov.className='ov';ov.id='ov';ov.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';
  ov.addEventListener('click',function(e){if(e.target===ov||e.target.closest('[data-close]'))closeSheet();});document.body.appendChild(ov);document.documentElement.classList.add('lock');var f=ov.querySelector('input,select,textarea');if(f)setTimeout(function(){f.focus();},50);}
function closeSheet(){var o=$('ov');if(o)o.remove();document.documentElement.classList.remove('lock');}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();});
function openAdd(){if(!GBU){needLogin('سجّل دخولك عشان تقدر تشارك كوبون');return;}
  openSheet('<h3>شارك كوبون</h3><p class="hint">الكوبون يتراجع قبل ما يتنشر، ويظهر بشارة «شاركه مستخدم».</p>'+
  '<div class="rules"><b>قبل ما ترسل</b>• حط رابط المصدر: حساب المتجر الرسمي أو موقعه أو صفحة العرض.<br>• كودات الدعوة الشخصية (ادعُ صديقك) تنرفض تلقائياً.<br>• لا تكتب أرقام جوال أو روابط ترويج لك.</div>'+
  '<form id="addF" class="fg" novalidate>'+
  '<label class="full">اسم المتجر أو المطعم<input name="store_name" required maxlength="60" autocomplete="off"></label>'+
  '<label>المدينة<select name="city" required>'+CITY_LIST.map(function(c){return '<option>'+c+'</option>';}).join('')+'</select></label>'+
  '<label>التصنيف<select name="category">'+CATS.slice(1).map(function(c){return '<option value="'+c[0]+'">'+c[1]+'</option>';}).join('')+'</select></label>'+
  '<label>نوع العرض<select name="unit"><option value="pct">خصم بالنسبة ٪</option><option value="sar">خصم بالريال</option><option value="gift">هدية مجانية</option><option value="bogo">1+1</option><option value="other">عرض آخر</option></select></label>'+
  '<label>القيمة<input name="value" type="number" inputmode="decimal" min="1" step="any" placeholder="مثال: 20"></label>'+
  '<label class="full">وش العرض؟<input name="title" required minlength="5" maxlength="140" placeholder="مثال: خصم على الطلبات فوق 100 ريال"></label>'+
  '<label>الكود<input name="code" class="ltr" maxlength="40" autocapitalize="characters" placeholder="اتركه فاضي لو بدون كود"></label>'+
  '<label>ينتهي في (اختياري)<input name="expires_at" type="date"></label>'+
  '<label class="full">رابط المصدر<input name="source_url" class="ltr" type="url" required inputmode="url" placeholder="https://instagram.com/..."></label>'+
  '</form><button class="sbtn" type="button" id="addSend">أرسل للمراجعة</button><button class="xbtn" type="button" data-close>إلغاء</button>');
  $('addSend').addEventListener('click',sendAdd);}
function sendAdd(){var f=$('addF'),d={};[].forEach.call(f.elements,function(x){if(x.name&&x.value.trim()!=='')d[x.name]=x.value.trim();});
  if(!d.store_name||d.store_name.length<2){toast('اكتب اسم المتجر');return;}
  if(!d.title||d.title.length<5){toast('اكتب وصف العرض بشكل أوضح');return;}
  if(!d.source_url||!/^https?:\/\/\S+\.\S+/i.test(d.source_url)){toast('رابط المصدر لازم يبدأ بـ https://');return;}
  if(d.value)d.value=+d.value;if(d.code)d.code=d.code.toUpperCase().replace(/\s+/g,'');
  if(d.expires_at&&daysLeft(d.expires_at)<0){toast('تاريخ الانتهاء فات');return;}
  d.kind='user';d.status='pending';d.gb_user_id=GBU.id;d.author_name=GBU.name||null;d.device_id=DEV;
  var b=$('addSend');b.disabled=true;b.textContent='لحظة…';
  sb('coupons',{method:'POST',body:d,prefer:'return=minimal'}).then(function(){closeSheet();toast('وصل كوبونك، بيتنشر بعد المراجعة');})
  .catch(function(e){b.disabled=false;b.textContent='أرسل للمراجعة';toast(/rate limit/.test(e.message)?'وصلت الحد اليومي (5 كوبونات)، جرّب بكرة':(e.status===401||e.status===403)?'ما قدرنا نستقبل الكوبون من حسابك':'صار خطأ، جرّب مرة ثانية');});}
function openOwner(id){var c=find(id);if(!c)return;if(!GBU){needLogin('سجّل دخولك عشان تقدر ترسل طلب صاحب المتجر');return;}
  openSheet('<h3>أنا صاحب «'+esc(c.store_name)+'»</h3><p class="hint">نخفي هذا الكوبون فوراً لين يراجعه فريق الدليل، ونتواصل معك.</p>'+
  '<form id="ownF" class="fg" novalidate><label class="full">وش تبي؟<select name="want"><option value="remove">أبي إزالة هذا الكوبون</option><option value="wrong">معلومات الكوبون غلط</option><option value="verify">أبي أوثّق متجري وأضيف عروضي الرسمية</option></select></label>'+
  '<label class="full">ملاحظة (اختياري)<textarea name="reason" maxlength="250"></textarea></label>'+
  '<label class="full">وسيلة تواصل (إيميل أو حساب المتجر الرسمي)<input name="contact" class="ltr" required maxlength="120"></label></form>'+
  '<button class="sbtn" type="button" id="ownSend">أرسل الطلب</button><button class="xbtn" type="button" data-close>إلغاء</button>');
  $('ownSend').addEventListener('click',function(){var f=$('ownF'),want=f.want.value,contact=f.contact.value.trim(),note=f.reason.value.trim();
    if(contact.length<4){toast('اكتب وسيلة تواصل عشان نرد عليك');return;}
    var W={remove:'طلب إزالة',wrong:'معلومات غلط',verify:'طلب توثيق المتجر'}[want];var b=this;b.disabled=true;
    sb('coupon_reports',{method:'POST',body:{coupon_id:id,kind:want==='verify'?'other':'owner',reason:(W+(note?': '+note:'')).slice(0,300),contact:contact,gb_user_id:GBU.id,device_id:DEV},prefer:'return=minimal'})
    .then(function(){closeSheet();if(want==='verify'){toast('وصل طلبك، بنتواصل معك لتوثيق متجرك');return;}ALL=ALL.filter(function(x){return x.id!==id;});renderAll();toast('وصل طلبك، وأخفينا الكوبون لين نراجعه');})
    .catch(function(){b.disabled=false;toast('صار خطأ، جرّب مرة ثانية');});});}

load();
</script>
